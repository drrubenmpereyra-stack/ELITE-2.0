<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro y Control de Supervisiones a Colegas - ELITE 2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #0891b2;
            --secondary-color: #22d3ee;
            --accent-bg: #ecfeff;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #334155;
            --border-color: #cffafe;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.5; padding: 20px; }

        .container { max-width: 900px; margin: 0 auto; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; border-top: 4px solid var(--primary-color); }
        h2 { font-size: 1.3rem; color: var(--primary-color); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }

        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        label { font-size: 0.85rem; font-weight: 600; color: var(--primary-color); }
        input[type="text"], input[type="date"], select, textarea {
            padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; background: #fff; outline: none; font-family: 'Poppins', sans-serif; transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(8, 145, 178, 0.1); }
        textarea { resize: vertical; min-height: 100px; }

        .section-subtitle { font-size: 1rem; font-weight: 600; color: #1e293b; margin: 25px 0 15px 0; border-bottom: 2px solid #f1f5f9; padding-bottom: 5px; display: flex; align-items: center; gap: 8px; }

        .btn { background-color: var(--primary-color); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.95rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 0.2s, transform 0.1s; width: 100%; margin-top: 10px; box-shadow: 0 4px 12px rgba(8, 145, 178, 0.2); }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }

        .success-alert { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; font-size: 0.9rem; text-align: center; }
    </style>
</head>
<body>

    <main class="container">
        <div class="card">
            <h2><image></image><i class="fa-solid fa-chalkboard-user"></i> Registro y Evaluación de Supervisiones a Colegas</h2>
            <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 25px;">
                Módulo de asesoría metodológica y análisis clínico impartido a profesionales supervisados.
            </p>

            <div id="alerta-exito" class="success-alert">
                <i class="fa-solid fa-circle-check"></i> ¡Acta de supervisión guardada exitosamente en el sistema!
            </div>

            <form id="form-supervision">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="fecha-supervision"><i class="fa-regular fa-calendar"></i> Fecha del Encuentro:</label>
                        <input type="date" id="fecha-supervision" required>
                    </div>
                    <div class="form-group">
                        <label for="nombre-colega"><i class="fa-solid fa-user-doctor"></i> Nombre del Colega Supervisando:</label>
                        <input type="text" id="nombre-colega" required placeholder="Ej. Lic. Pérez">
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="modalidad-sup"><i class="fa-solid fa-laptop-file"></i> Modalidad:</label>
                        <select id="modalidad-sup">
                            <option value="Individual Presencial">Individual Presencial</option>
                            <option value="Individual Virtual">Individual Virtual</option>
                            <option value="Grupal">Grupal</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="marco-teorico"><i class="fa-solid fa-book-medical"></i> Marco Teórico / Enfoque:</label>
                        <input type="text" id="marco-teorico" placeholder="Ej. Psicoanalítico / Convergente / Fooriniano">
                    </div>
                </div>

                <div class="section-subtitle"><i class="fa-solid fa-stethoscope"></i> Viñeta y Planteo del Caso por el Colega</div>
                
                <div class="form-group">
                    <label for="motivo-consulta-sup">Motivo de la Supervisión / Punto de Estancamiento:</label>
                    <textarea id="motivo-consulta-sup" placeholder="Describa el núcleo del conflicto que reporta el colega con respecto al paciente..."></textarea>
                </div>

                <div class="section-subtitle"><i class="fa-solid fa-glasses"></i> Análisis Crítico y Observaciones del Supervisor</div>

                <div class="form-group">
                    <label for="puntos-ciegos">Puntos Ciegos y Obstáculos Detectados en el Tratante:</label>
                    <textarea id="puntos-ciegos" placeholder="Análisis de contratransferencia, resistencias o sesgos operativos del colega..."></textarea>
                </div>

                <div class="form-group">
                    <label for="orientaciones-clinicas">Orientaciones Metodológicas y Plan Terapéutico Acordado:</label>
                    <textarea id="orientaciones-clinicas" placeholder="Directrices, intervenciones sugeridas y cambios tácticos indicados..."></textarea>
                </div>

                <button type="submit" class="btn"><i class="fa-solid fa-floppy-disk"></i> Guardar Acta de Supervisión</button>
            </form>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCJietA0GuHsUpkN2-lk38Y3L6VDROxvZs",
            authDomain: "materiales-terapeuticos.firebaseapp.com",
            projectId: "materiales-terapeuticos",
            storageBucket: "materiales-terapeuticos.firebasestorage.app",
            messagingSenderId: "827133493876",
            appId: "1:827133493876:web:7d51b4befe64e0f8dfc721"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('form-supervision').addEventListener('submit', async (e) => {
            e.preventDefault();

            const dataSupervision = {
                fecha: document.getElementById('fecha-supervision').value,
                colega: document.getElementById('nombre-colega').value.trim(),
                modalidad: document.getElementById('modalidad-sup').value,
                marcoTeorico: document.getElementById('marco-teorico').value.trim(),
                motivoConsulta: document.getElementById('motivo-consulta-sup').value.trim(),
                puntosCiegos: document.getElementById('puntos-ciegos').value.trim(),
                orientaciones: document.getElementById('orientaciones-clinicas').value.trim(),
                timestamp: new Date().toISOString()
            };

            try {
                await addDoc(collection(db, "supervisiones_colegas"), dataSupervision);
                document.getElementById('alerta-exito').style.display = 'block';
                document.getElementById('form-supervision').reset();
                setTimeout(() => {
                    document.getElementById('alerta-exito').style.display = 'none';
                }, 4000);
            } catch (error) {
                console.error("Error al guardar supervisión: ", error);
                alert("Hubo un error al registrar la supervisión en la base de datos.");
            }
        });
    </script>
</body>
</html>
