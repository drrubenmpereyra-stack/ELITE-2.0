<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REAT: Evaluación de Adherencia al Tratamiento - ELITE 7.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #bf00ff;
            --bg-dark: #000000;
            --panel-dark: #050505;
            --border-color: #222222;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: #fff; padding: 20px; line-height: 1.4; }

        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: var(--panel-dark); border-radius: 8px; padding: 25px; box-shadow: 0 0 15px rgba(191, 0, 255, 0.1); margin-bottom: 20px; border-top: 4px solid var(--primary-color); }
        h2 { font-size: 1.2rem; color: var(--primary-color); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        h3 { font-size: 1rem; color: #fff; margin: 15px 0 10px 0; border-bottom: 2px solid var(--border-color); padding-bottom: 5px; }

        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
        label { font-size: 0.85rem; font-weight: 600; color: var(--primary-color); }
        select, input[type="date"] { padding: 10px 12px; background: #000; color: #fff; border: 1px solid var(--primary-color); border-radius: 4px; font-size: 0.9rem; }
        select:focus, input[type="date"]:focus { outline: none; border-color: #fff; }

        .adh-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 20px; }
        .adh-card { background: #0a0a0a; border: 1px solid var(--border-color); padding: 20px; border-radius: 8px; }
        .adh-card h4 { color: var(--primary-color); margin: 0 0 15px 0; font-size: 13px; text-transform: uppercase; }
        
        .c-1 { color: #ff0000 !important; } 
        .c-2 { color: #ff8000 !important; } 
        .c-3 { color: #ffff00 !important; } 
        .c-4 { color: #00ff00 !important; } 

        .adh-check-group { display: flex; flex-direction: column; gap: 10px; }
        .adh-check-item { display: flex; align-items: center; gap: 10px; font-size: 12px; cursor: pointer; }
        .adh-hint { font-size: 11px; font-style: italic; margin-top: 10px; min-height: 45px; color: #aaa; border-top: 1px solid #222; padding-top: 8px; }
        
        .btn-elite-adh { background: var(--primary-color); color: #000; border: none; padding: 12px 25px; font-weight: bold; cursor: pointer; border-radius: 4px; text-transform: uppercase; margin: 5px; transition: opacity 0.2s; }
        .btn-elite-adh:hover { opacity: 0.85; }
        .btn-outline-adh { background: transparent; color: var(--primary-color); border: 1px solid var(--primary-color); padding: 12px 25px; font-weight: bold; cursor: pointer; border-radius: 4px; text-transform: uppercase; margin: 5px; }
        
        #adh-ia-report { background: #050505; border: 1px solid var(--primary-color); padding: 25px; border-radius: 8px; color: #ccc; display: none; line-height: 1.6; margin-top: 20px; font-size: 14px; }
        .canvas-adh-box { margin-top: 25px; background: #000; padding: 20px; border: 1px solid var(--border-color); border-radius: 8px; }
    </style>
</head>
<body>

    <main class="container">
        <div class="card">
            <h2><i class="fa-solid fa-clipboard-check"></i> REAT: Evaluación de Adherencia al Tratamiento</h2>
            <p style="font-size: 0.85rem; color: #aaa; margin-bottom: 20px;">
                Módulo independiente para la valoración del compromiso ejecutivo, integración neurocognitiva, apertura vincular y regulación emocional.
            </p>

            <div style="display:flex; gap:20px; background:#0a0a0a; padding:20px; margin-bottom:20px; border:1px solid rgba(191,0,255,0.2);">
                <div style="flex:2;" class="form-group"><label>PACIENTE:</label><select id="adh-p-select"></select></div>
                <div style="flex:1;" class="form-group"><label>FECHA:</label><input type="date" id="adh-fecha"></div>
            </div>

            <div class="adh-grid">
                <!-- Se inyectarán mediante script los 4 indicadores principales -->
            </div>

            <div style="display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin:30px 0;">
                <button class="btn-elite-adh" onclick="graficarAcelerometro()"><i class="fa-solid fa-gauge-high"></i> Graficar Acelerómetro</button>
                <button class="btn-outline-adh" onclick="generarInformeAdhIA_REAT()"><i class="fa-solid fa-file-lines"></i> Informe con IA (REAT)</button>
                <button class="btn-elite-adh" style="background:#2ecc71; color:#fff;" onclick="window.imprimirInformeREAT_PDF()"><i class="fa-solid fa-print"></i> Imprimir Informe PDF</button>
            </div>

            <div id="adh-canvas-container" class="canvas-adh-box" style="display:none; flex-direction:column; align-items:center;"></div>
            <div id="adh-ia-report"></div>
            <div id="adh-etiqueta-final" style="display:flex; justify-content:center; margin-top:30px;"></div>
            
            <div style="margin:40px 0 0 0;">
                <button onclick="guardarRegistroAdh_REAT()" class="btn-elite-adh" style="width:100%;"><i class="fa-solid fa-floppy-disk"></i> Guardar Registro Final</button>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCJietA0GuHsUpkN2-lk38Y3L6VDROxvZs",
            authDomain: "materiales-terapeuticos.firebaseapp.com",
            projectId: "materiales-terapeuticos",
            storageBucket: "materiales-terapeuticos.firebasestorage.app",
            messagingSenderId: "827133493876",
            appId: "1:827133493876:web:7d51b4befe64e0f8dfc721"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const indicadoresREAT = [
            { titulo: "Compromiso ejecutivo", id: "ce", ops: [
                {t:"Insuficiente", h:"Inasistencias frecuentes sin aviso; llega con más de 15 min de retraso.", p:1, c:"c-1"},
                {t:"En Desarrollo", h:"Asistencia irregular; requiere recordatorios constantes.", p:2, c:"c-2"},
                {t:"Satisfactorio", h:"Asistencia constante; avisos previos en caso de ausencia.", p:3, c:"c-3"},
                {t:"Sobresaliente", h:"Puntualidad rigurosa; prioriza la sesión en su agenda.", p:4, c:"c-4"}
            ]},
            { titulo: "Integración neurocognitiva", id: "inc", ops: [
                {t:"Insuficiente", h:"No realiza tareas entre sesiones; olvida los temas tratados.", p:1, c:"c-1"},
                {t:"En Desarrollo", h:"Realiza tareas parcialmente o de forma superficial bajo presión.", p:2, c:"c-2"},
                {t:"Satisfactorio", h:"Aplica herramientas fuera de consulta; recuerda conceptos clave.", p:3, c:"c-3"},
                {t:"Sobresaliente", h:"Generaliza el aprendizaje; propone sus propios ejercicios o insights.", p:4, c:"c-4"}
            ]},
            { titulo: "Apertura y alianza", id: "aa", ops: [
                {t:"Insuficiente", h:"Actitud defensiva o evasiva; oculta información relevante.", p:1, c:"c-1"},
                {t:"En Desarrollo", h:"Colaboración pasiva; responde pero no profundiza espontáneamente.", p:2, c:"c-2"},
                {t:"Satisfactorio", h:"Participación activa; valida el vínculo y expresa dudas.", p:3, c:"c-3"},
                {t:"Sobresaliente", h:"Transparencia radical; utiliza el espacio para la vulnerabilidad profunda.", p:4, c:"c-4"}
            ]},
            { titulo: "Regulación emocional", id: "re", ops: [
                {t:"Insuficiente", h:"Dependencia total del terapeuta para regularse durante la crisis.", p:1, c:"c-1"},
                {t:"En Desarrollo", h:"Reconoce el desbalance pero le cuesta aplicar técnicas de regulación.", p:2, c:"c-2"},
                {t:"Satisfactorio", h:"Implementa técnicas de autorregulación con éxito moderado.", p:3, c:"c-3"},
                {t:"Sobresaliente", h:"Autonomía regulatoria; identifica disparadores antes del desborde.", p:4, c:"c-4"}
            ]}
        ];

        async function init() {
            const grid = document.querySelector('.adh-grid');
            grid.innerHTML = indicadoresREAT.map(ind => renderIndicador(ind.titulo, ind.id, ind.ops)).join('');

            try {
                const snap = await getDocs(collection(db, "patients"));
                const sel = document.getElementById('adh-p-select');
                sel.innerHTML = '<option value="">-- Seleccionar Paciente --</option>';
                snap.forEach(d => {
                    let opt = document.createElement('option');
                    opt.value = d.id;
                    opt.textContent = d.data().name;
                    sel.appendChild(opt);
                });
            } catch (e) {
                console.error("Error al cargar pacientes de Firestore:", e);
            }
            document.getElementById('adh-fecha').value = new Date().toISOString().split('T')[0];
        }

        function renderIndicador(titulo, id, ops) {
            return `
                <div class="adh-card">
                    <h4>${titulo}</h4>
                    <div class="adh-check-group">
                        ${ops.map((o, i) => `
                            <label class="adh-check-item ${o.c}">
                                <input type="checkbox" class="ck-adh-${id}" data-p="${o.p}" data-hint="${o.h}" data-title="${o.t}" onchange="toggleAdhCheck('${id}', ${i})"> ${o.t}
                            </label>
                        `).join('')}
                    </div>
                    <div id="hint-${id}" class="adh-hint">Seleccione nivel...</div>
                </div>`;
        }

        window.toggleAdhCheck = function(id, idx) {
            const cks = document.querySelectorAll(`.ck-adh-${id}`);
            const hint = document.getElementById(`hint-${id}`);
            if (cks[idx].checked) {
                cks.forEach((c, i) => { if(i !== idx) c.checked = false; });
                hint.innerText = cks[idx].dataset.hint;
            } else { 
                hint.innerText = "Seleccione nivel..."; 
            }
        };

        window.graficarAcelerometro = function() {
            let total = 0;
            document.querySelectorAll('.adh-check-group input:checked').forEach(c => total += parseInt(c.dataset.p));
            const container = document.getElementById('adh-canvas-container');
            container.style.display = 'flex';

            let status = "N/A", color = "#333", r="#333", n="#333", y="#333", g="#333";
            
            if(total === 4) { status = "Resistencia crítica"; color = "#ff0000"; r="#ff0000"; }
            else if(total >= 5 && total <= 8) { status = "Adherencia frágil"; color = "#ff8000"; r="#ff0000"; n="#ff8000"; }
            else if(total >= 9 && total <= 12) { status = "Adherencia funcional"; color = "#ffff00"; r="#ff0000"; n="#ff8000"; y="#ffff00"; }
            else if(total >= 13) { status = "Adherencia óptima"; color = "#00ff00"; r="#ff0000"; n="#ff8000"; y="#ffff00"; g="#00ff00"; }

            let angle = (total / 16) * 180 - 90;
            container.innerHTML = `
                <svg id="svg-reat-print" width="400" height="220" viewBox="0 0 400 200">
                    <path d="M 60 180 A 140 140 0 0 1 120 60" fill="none" stroke="${r}" stroke-width="35" />
                    <path d="M 120 60 A 140 140 0 0 1 280 60" fill="none" stroke="${n}" stroke-width="35" stroke-dasharray="80 1000" />
                    <path d="M 200 40 A 140 140 0 0 1 280 60" fill="none" stroke="${y}" stroke-width="35" />
                    <path d="M 280 60 A 140 140 0 0 1 340 180" fill="none" stroke="${g}" stroke-width="35" />
                    <circle cx="200" cy="180" r="8" fill="#fff" />
                    <line x1="200" y1="180" x2="${200 + 120 * Math.sin(angle * Math.PI / 180)}" y2="${180 - 120 * Math.cos(angle * Math.PI / 180)}" stroke="#fff" stroke-width="4" />
                    <text x="200" y="210" text-anchor="middle" fill="${color}" font-size="16" font-weight="bold">${total} PUNTOS: ${status.toUpperCase()}</text>
                </svg>`;
        };

        window.generarInformeAdhIA_REAT = function() {
            let total = 0; let rows = "";
            document.querySelectorAll('.adh-card').forEach(card => {
                const ck = card.querySelector('input:checked');
                if(ck) {
                    total += parseInt(ck.dataset.p);
                    rows += `<p>• <b>${card.querySelector('h4').innerText}:</b> ${ck.dataset.title}. ${ck.dataset.hint}</p>`;
                }
            });

            const box = document.getElementById('adh-ia-report');
            let rango = "", interp = "", prospect = "";

            if(total === 4) { 
                rango = "Resistencia Crítica"; 
                interp = "La intervención debe virar exclusivamente hacia el fortalecimiento de la alianza o evaluar si el enfoque actual es el adecuado para la estructura de personalidad del paciente.";
                prospect = "<b>Enfoque en Seguridad:</b> Reducir la carga cognitiva (menos tareas, más validación emocional). Priorizar la estabilización del sistema límbico antes de intentar reestructuración cognitiva.";
            } else if(total <= 8) {
                rango = "Adherencia Frágil";
                interp = "Riesgo elevado de abandono. Es necesario renegociar los objetivos terapéuticos y evaluar resistencias inconscientes.";
                prospect = "<b>Enfoque en Seguridad:</b> Neurofeedback verbal: reforzar positivamente cada pequeño avance para estimular el circuito de recompensa. Menos tareas cognitivas, mayor foco en la regulación de la amígdala.";
            } else if(total <= 12) {
                rango = "Adherencia Funcional";
                interp = "Existe un compromiso sólido pero con 'puntos ciegos'. Se recomienda reforzar la motivación intrínseca y explorar ambivalencias.";
                prospect = "<b>Enfoque en Autonomía:</b> Utilizar la 'entrevista motivacional' para resolver la ambivalencia. Fomentar la metacognición: pedir al paciente que observe sus propios procesos de resistencia sin juzgarse.";
            } else {
                rango = "Adherencia Óptima";
                interp = "El paciente presenta una alta plasticidad conductual. El tratamiento puede avanzar hacia objetivos de mayor complejidad o hacia el cierre y mantenimiento.";
                prospect = "<b>Enfoque en Plasticidad:</b> Aumentar el desafío terapéutico (exposición o confrontación suave). Trabajar en la prevención de recaídas mediante el fortalecimiento de las proyecciones futuras (corteza prefrontal dorsolateral).";
            }

            box.innerHTML = `
                <h3 style="color:#bf00ff; border-bottom:1px solid #bf00ff; padding-bottom:10px;">INFORME REAT - VOLCADO LITERAL</h3>
                <p><b>RESULTADO:</b> ${total} Puntos - <b>NIVEL:</b> ${rango}</p>
                <div style="margin:15px 0;">${rows}</div>
                <h4 style="color:#bf00ff;">INTERPRETACIÓN CLÍNICA:</h4><p>${interp}</p>
                <h4 style="color:#bf00ff;">ORIENTACIONES PROSPECTIVAS:</h4><p>${prospect}</p>
                <p style="font-size:11px; color:#555; margin-top:20px; border-top:1px solid #222; padding-top:10px;">Nota: Un descenso en la rúbrica a mitad del tratamiento suele señalar el inicio del trabajo con material traumático profundo.</p>
            `;
            box.style.display = 'block'; 
            box.scrollIntoView({ behavior: 'smooth' });
        };

        window.guardarRegistroAdh_REAT = async function() {
            const selectP = document.getElementById('adh-p-select');
            const patientId = selectP.value;
            const pName = selectP.options[selectP.selectedIndex]?.text || "N/A";
            const f = document.getElementById('adh-fecha').value;

            if(!patientId) return alert("Seleccione un paciente de la base de datos.");

            let t = 0; let res = ""; let resultadosArray = [];
            document.querySelectorAll('.adh-card').forEach(card => {
                const ck = card.querySelector('input:checked');
                if(ck) { 
                    t += parseInt(ck.dataset.p); 
                    const itemText = `${card.querySelector('h4').innerText}: ${ck.dataset.title} (${ck.dataset.p} pts)`;
                    res += `<br>${itemText}`; 
                    resultadosArray.push(itemText);
                }
            });
            let tit = (t===4)?"Resistencia crítica":(t<=8)?"Adherencia frágil":(t<=12)?"Adherencia funcional":"Adherencia óptima";
            
            document.getElementById('adh-etiqueta-final').innerHTML = `
                <div style="border:3px solid #bf00ff; background:#000; padding:25px; width:450px; border-radius:12px; box-shadow:0 0 20px #bf00ff; color:#fff; text-align:center;">
                    <h4 style="color:#bf00ff; margin:0; text-transform:uppercase;">ETIQUETA REAT - ELITE 7.0</h4>
                    <p><b>PACIENTE:</b> ${pName} | <b>FECHA:</b> ${f}</p>
                    <div style="font-size:12px; margin:10px 0; border:1px solid #222; padding:10px; background:#050505;">${res}</div>
                    <div style="background:#111; padding:15px; border:1px solid rgba(191,0,255,0.4);">
                        <h2 style="margin:0; color:#bf00ff;">TOTAL: ${t} PUNTOS</h2>
                        <p style="margin:5px 0; font-weight:bold; letter-spacing:1px;">${tit.toUpperCase()}</p>
                    </div>
                </div>`;

            try {
                const ref = doc(db, "patients", patientId);
                const snap = await getDoc(ref);
                let lista = snap.exists() && snap.data().adherencia_reat ? snap.data().adherencia_reat : [];
                lista.push({
                    id: Date.now().toString(),
                    fecha: f,
                    puntajeTotal: t,
                    nivel: tit,
                    resultados: resultadosArray,
                    informe: document.getElementById('adh-ia-report').innerText
                });
                await updateDoc(ref, { adherencia_reat: lista });
                alert("¡Registro REAT guardado exitosamente en Firestore!");
            } catch(e) {
                console.error("Error al guardar en Firestore:", e);
                alert("Error al guardar el registro en la base de datos.");
            }
        };

        window.imprimirInformeREAT_PDF = function() {
            const p = document.getElementById('adh-p-select').options[document.getElementById('adh-p-select').selectedIndex]?.text || "Paciente No Seleccionado";
            const f = document.getElementById('adh-fecha').value || new Date().toLocaleDateString();
            const iaContent = document.getElementById('adh-ia-report').innerHTML || "Sin informe generado";
            const totalHtml = document.getElementById('adh-etiqueta-final').innerHTML || "Sin registro final";
            const svgContent = document.getElementById('adh-canvas-container').innerHTML;

            const win = window.open('', '_blank');
            win.document.write(`
                <html>
                <head>
                    <title>Informe REAT - ${p}</title>
                    <style>
                        body { font-family: 'Segoe UI', Arial, sans-serif; padding: 40px; color: #333; }
                        .header { text-align: right; border-bottom: 3px solid #bf00ff; padding-bottom: 10px; margin-bottom: 20px; }
                        .header h1 { margin: 0; font-size: 20px; color: #bf00ff; }
                        .paciente-info { margin-bottom: 30px; padding: 10px; background: #fdf0ff; border-radius: 5px; }
                        .ia-report { background: #fdfdfd; padding: 20px; border: 1px solid #ddd; border-radius: 8px; margin: 20px 0; }
                        .graphics-container { text-align: center; margin: 30px 0; background: #000; padding: 20px; border-radius: 10px; }
                        .footer { margin-top: 50px; text-align: center; font-size: 10px; color: #999; border-top: 1px solid #eee; padding-top: 10px; }
                        @media print { .no-print { display: none; } }
                    </style>
                </head>
                <body onload="window.print();">
                    <div class="header">
                        <h1>Dr. y Mgter. Rubén M. Pereyra</h1>
                        <p>Especialista en Psicoterapia Psicoanalítica Focalizada y Neurociencias</p>
                    </div>
                    <div class="paciente-info">
                        <strong>PACIENTE:</strong> ${p} | <strong>FECHA:</strong> ${f}
                    </div>
                    <h2 style="color: #bf00ff; text-align: center;">RÚBRICA DE EVALUACIÓN DE ADHERENCIA (REAT)</h2>
                    
                    <div class="ia-report">
                        ${iaContent}
                    </div>

                    <div class="graphics-container">
                        ${svgContent}
                    </div>

                    <div style="display: flex; justify-content: center;">
                        ${totalHtml}
                    </div>

                    <div class="footer">
                        Elite 7.0 - Unidad de Convergencia Clínica - 2026
                    </div>
                </body>
                </html>
            `);
            win.document.close();
        };

        init();
    </script>
</body>
</html>
