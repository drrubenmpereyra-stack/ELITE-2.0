<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación de Memorias Traumáticas (REMT) - ELITE 2.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent-color: #adff2f;
            --bg-dark: #000000;
            --panel-dark: #111111;
            --border-color: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: #fff; padding: 20px; line-height: 1.4; }

        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: var(--panel-dark); border-radius: 8px; padding: 25px; box-shadow: 0 0 15px rgba(173, 255, 47, 0.1); margin-bottom: 20px; border-top: 4px solid var(--accent-color); }
        h2 { font-size: 1.2rem; color: var(--accent-color); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        h3 { font-size: 1rem; color: #fff; margin: 15px 0 10px 0; border-bottom: 2px solid var(--border-color); padding-bottom: 5px; }

        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
        label { font-size: 0.85rem; font-weight: 600; color: var(--accent-color); }
        select, input[type="date"] { padding: 10px 12px; background: #000; color: #fff; border: 1px solid var(--accent-color); border-radius: 4px; font-size: 0.9rem; }
        select:focus, input[type="date"]:focus { outline: none; border-color: #fff; }

        .indicador-row { margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
        .prog-bar { flex-grow: 1; height: 10px; background: #1a1a1a; border-radius: 5px; overflow: hidden; border: 1px solid var(--border-color); }
        .prog-fill { height: 100%; width: 0%; transition: all 0.4s ease; }
        .val-num-trauma { width: 60px; background: #000; border: 1px solid var(--accent-color); color: var(--accent-color); text-align: center; font-weight: bold; padding: 6px; border-radius: 4px; }
        .val-leyenda { font-size: 0.8rem; font-weight: bold; width: 140px; text-align: right; }

        .btn { background-color: #000; color: var(--accent-color); border: 1px solid var(--accent-color); padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 6px; transition: background 0.2s; }
        .btn:hover { background-color: var(--accent-color); color: #000; }
        .btn-secondary { background-color: #2ecc71; color: #fff; border-color: #2ecc71; }
        .btn-secondary:hover { background-color: #27ae60; }

        #canvas-radar-trauma { background: #080808; border: 1px solid var(--border-color); margin-top: 20px; display: none; width: 100%; max-width: 650px; border-radius: 8px; display: block; margin-left: auto; margin-right: auto; }
        #informe-ia-box { background: #050505; border: 1px solid var(--accent-color); color: #eee; padding: 25px; margin-top: 20px; font-size: 0.9rem; display: none; text-align: justify; line-height: 1.6; border-radius: 6px; }
        .tag-final-trauma { display: none; margin-top: 30px; padding: 20px; background: #000; border: 2px solid var(--accent-color); width: 100%; max-width: 500px; margin-left: auto; margin-right: auto; text-align: left; font-family: 'Courier New', Courier, monospace; color: var(--accent-color); border-radius: 6px; }
        
        .history-item { background: #080808; border-left: 4px solid var(--accent-color); padding: 15px; border-radius: 6px; margin-bottom: 12px; font-size: 0.9rem; border: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <main class="container">
        <!-- Selección de Paciente -->
        <div class="card">
            <h2><i class="fa-solid fa-user-injured"></i> Seleccionar Paciente Activo</h2>
            <div class="form-group" style="max-width: 400px;">
                <label for="patient-select">Paciente</label>
                <select id="patient-select" onchange="cargarHistorialTrauma()">
                    <option value="">-- Seleccione un paciente --</option>
                </select>
            </div>
        </div>

        <!-- Formulario REMT -->
        <div class="card" id="form-card" style="display: none;">
            <h2><i class="fa-solid fa-brain"></i> Evaluación de Memorias Traumáticas (REMT)</h2>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-bottom:20px;">
                <div class="form-group"><label>FECHA DE EVALUACIÓN:</label><input type="date" id="trauma-fecha"></div>
            </div>

            <div>
                <script>
                    const indicadoresTrauma = ['Intrusión sensorial', 'Reactividad neurovegetativa', 'Fragmentación narrativa', 'Evitación y constricción', 'Carga alostática percibida', 'Alteración de la autopercepción'];
                    indicadoresTrauma.forEach((n, i) => {
                        document.write(`
                            <div class="indicador-row">
                                <span style="font-size:0.9rem; color:var(--accent-color); font-weight:bold; text-transform:uppercase;">${n}</span>
                                <div style="display:flex; align-items:center; gap:20px; margin-top:8px;">
                                    <input type="number" class="val-num-trauma" min="0" max="3" value="0" onchange="window.updateTraumaInd(${i}, this.value)">
                                    <div class="prog-bar"><div id="bar-t-${i}" class="prog-fill"></div></div>
                                    <span id="txt-t-${i}" class="val-leyenda" style="color:#00ff00;">0 Ausente</span>
                                </div>
                            </div>
                        `);
                    });
                </script>
            </div>

            <div style="display:flex; flex-wrap:wrap; gap:10px; margin-top:20px;">
                <button class="btn" onclick="window.graficarTraumaRadar()"><i class="fa-solid fa-chart-radar"></i> Graficar Perfil</button>
                <button class="btn" onclick="window.generarInformeTraumaIA()"><i class="fa-solid fa-file-lines"></i> Informe Literal REMT IA</button>
                <button class="btn" onclick="window.guardarFichaTrauma()"><i class="fa-solid fa-floppy-disk"></i> Guardar Ficha</button>
                <button class="btn btn-secondary" onclick="window.imprimirInformeREMT_PDF()"><i class="fa-solid fa-print"></i> Imprimir PDF</button>
            </div>

            <canvas id="canvas-radar-trauma" width="650" height="400"></canvas>
            <div id="informe-ia-box"></div>
            <div id="tag-trauma-final" class="tag-final-trauma"></div>
        </div>

        <!-- Historial -->
        <div class="card" id="history-card" style="display: none;">
            <h2><i class="fa-solid fa-clock-rotate-left"></i> Historial de Evaluaciones de Memorias Traumáticas</h2>
            <div id="history-container">
                <p style="color: #666; font-size: 0.9rem;">Seleccione un paciente para ver su historial de valoraciones.</p>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCJietA0GuHsUpkN2-lk38Y3L6VDROxvZs",
            authDomain: "materiales-terapeuticos.firebaseapp.com",
            projectId: "materiales-terapeuticos",
            storageBucket: "materiales-terapeuticos.firebasestorage.app",
            messagingSenderId: "827133493876",
            appId: "1:827133493876:web:7d51b4befe64e0f8dfc721"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let activePatientId = null;
        let activePatientName = "";

        async function init() {
            try {
                const snap = await getDocs(collection(db, "patients"));
                const select = document.getElementById('patient-select');
                snap.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.id;
                    opt.textContent = d.data().name;
                    select.appendChild(opt);
                });
            } catch (e) {
                console.error("Error al cargar pacientes:", e);
            }
            document.getElementById('trauma-fecha').valueAsDate = new Date();
        }

        window.updateTraumaInd = function(idx, val) {
            const colors = ['#00ff00', '#ffff00', '#ffa500', '#ff0000'];
            const leyendas = ['0 Ausente / Integrado', '1 Leve / Emergente', '2 Moderado / Disfuncional', '3 Grave / Desadaptativo'];
            const bar = document.getElementById(`bar-t-${idx}`);
            const txt = document.getElementById(`txt-t-${idx}`);
            val = Math.min(Math.max(val, 0), 3);
            bar.style.width = ((val / 3) * 100) + '%';
            bar.style.backgroundColor = colors[val];
            txt.innerText = leyendas[val];
            txt.style.color = colors[val];
        };

        window.graficarTraumaRadar = function() {
            const canvas = document.getElementById('canvas-radar-trauma');
            canvas.style.display = 'block'; 
            const ctx = canvas.getContext('2d');
            const vals = Array.from(document.querySelectorAll('.val-num-trauma')).map(i => parseInt(i.value) || 0);
            const labels = ['INTRUSIÓN SENSORIAL', 'REACTIVIDAD NEUROVEG.', 'FRAGMENTACIÓN NARR.', 'EVITACIÓN/CONSTRIC.', 'CARGA ALOSTÁTICA', 'AUTOPERCEPCIÓN'];
            const cx = canvas.width/2, cy = canvas.height/2, rMax = 120;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#333';
            
            for(let j = 1; j <= 3; j++) {
                ctx.beginPath(); 
                let r = (j / 3) * rMax;
                for(let i = 0; i < 6; i++) { 
                    let a = (Math.PI * 2 / 6) * i - Math.PI / 2; 
                    if(i === 0) ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
                    else ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); 
                }
                ctx.closePath(); 
                ctx.stroke();
            }

            ctx.strokeStyle = '#adff2f'; 
            ctx.fillStyle = 'rgba(173,255,47,0.3)'; 
            ctx.lineWidth = 2;
            ctx.beginPath();
            for(let i = 0; i < 6; i++) {
                let a = (Math.PI * 2 / 6) * i - Math.PI / 2; 
                let r = (vals[i] / 3) * rMax;
                let x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
                if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.closePath(); 
            ctx.stroke(); 
            ctx.fill();

            ctx.fillStyle = '#fff'; 
            ctx.font = 'bold 9px Arial';
            for(let i = 0; i < 6; i++) {
                let a = (Math.PI * 2 / 6) * i - Math.PI / 2;
                ctx.fillText(labels[i], cx + Math.cos(a) * (rMax + 25) - 35, cy + Math.sin(a) * (rMax + 15));
            }
            canvas.scrollIntoView({ behavior: 'smooth' });
        };

        window.generarInformeTraumaIA = function() {
            const box = document.getElementById('informe-ia-box');
            const total = Array.from(document.querySelectorAll('.val-num-trauma')).reduce((a, b) => a + (parseInt(b.value) || 0), 0);
            
            let literalText = `<h3 style="color:#adff2f; text-align:center; border-bottom:1px solid #adff2f; padding-bottom:10px;">INFORME NEUROPSICOLÓGICO REMT (LITERAL)</h3>`;

            if (total <= 5) {
                literalText += `
                    <h4>0-5 PUNTOS: Nivel Bajo / Resiliente</h4>
                    <p>Existe un procesamiento adecuado. El recuerdo es doloroso pero está integrado en la biografía. El hipocampo ha logrado "fechar" el evento en el pasado. Procesamiento integrado, hipocampo funcional.</p>
                    <h4>Líneas de Intervención: VALORACIÓN BAJA</h4>
                    <p>Foco: Psicoeducación y monitoreo. Técnica: Narración estructurada para reforzar la coherencia del self.</p>`;
            } else if (total <= 12) {
                literalText += `
                    <h4>6-12 PUNTOS: Nivel Moderado / Trauma No Integrado</h4>
                    <p>Existe una interferencia significativa. El sistema de respuesta al estrés está sensibilizado. Se requiere facilitar la síntesis mental entre la memoria implícita y narrativa.</p>
                    <h4>Líneas de Intervención: VALORACIÓN MODERADA</h4>
                    <p>Foco: Regulación del sistema nervioso. Grounding para fortalecer corteza prefrontal y reducir secuestro amigdalino. Identificación de "zonas de clivaje".</p>`;
            } else {
                literalText += `
                    <h4>13-18 PUNTOS: Nivel Alto / Desregulación Severa</h4>
                    <p>El trauma domina la arquitectura cognitiva. Colapso en simbolización y marcada desregulación neurobiológica. Indicativo de posible TEP.</p>
                    <h4>Líneas de Intervención: VALORACIÓN ALTA</h4>
                    <p>Foco: Estabilización Somática extrema. Trabajo con la ventana de tolerancia y regulación vía nervio vago. Protocolos de re-consolidación de memoria.</p>`;
            }

            literalText += `<p style="border-top:1px solid #333; padding-top:10px; font-size:10px; color:#adff2f; margin-top:10px;">Nota Clínica: La alianza terapéutica actúa como una "prótesis prefrontal".</p>`;
            
            box.innerHTML = literalText;
            box.style.display = 'block';
            box.scrollIntoView({ behavior: 'smooth' });
        };

        window.guardarFichaTrauma = async function() {
            const tag = document.getElementById('tag-trauma-final');
            const fecha = document.getElementById('trauma-fecha').value;
            const vals = Array.from(document.querySelectorAll('.val-num-trauma')).map(i => parseInt(i.value) || 0);
            const total = vals.reduce((a, b) => a + b, 0);
            const labels = ['INTRUSIÓN SENSORIAL', 'REACTIVIDAD NEUROVEG.', 'FRAGMENTACIÓN NARR.', 'EVITACIÓN/CONSTRIC.', 'CARGA ALOSTÁTICA', 'AUTOPERCEPCIÓN'];
            
            let nivelLabel = "";
            if(total <= 5) nivelLabel = "Nivel Bajo (0 a 5 puntos) Procesamiento integrado, hipocampo funcional";
            else if(total <= 12) nivelLabel = "Nivel Moderado (6 a 12 puntos) Interferencia significativa, sistema de estres sensibilizado";
            else nivelLabel = "Nivel Alto (13 a 18 puntos) Colapso de simbolización, desregulación severa (posible TEP)";

            const payload = {
                id: Date.now().toString(),
                fecha: fecha,
                puntajeTotal: total,
                valores: vals,
                nivel: nivelLabel,
                informe: document.getElementById('informe-ia-box').innerHTML
            };

            tag.innerHTML = `
                <div style="border-bottom:1px solid #adff2f; padding-bottom:5px; margin-bottom:10px; text-align:center; font-weight:bold;">ELITE 2.0 - FICHA CLÍNICA REMT</div>
                <div>PACIENTE: ${activePatientName}</div>
                <div>FECHA: ${fecha}</div>
                <div style="border:1px solid #333; padding:8px; margin-top:10px; background:#080808;">
                    ${labels.map((l, i) => `<div style="display:flex; justify-content:space-between; font-size:10px;"><span>${l}:</span> <span>${vals[i]}/3</span></div>`).join('')}
                </div>
                <div style="font-size:11px; font-weight:bold; color:#adff2f; border-top:1px solid #adff2f; padding-top:10px; margin-top:10px;">TOTAL: ${total} / 18 PUNTOS</div>
                <div style="font-size:10px; margin-top:5px; line-height:1.2;">${nivelLabel}</div>
            `;
            tag.style.display = 'block';
            tag.scrollIntoView({ behavior: 'smooth' });

            try {
                const ref = doc(db, "patients", activePatientId);
                const snap = await getDoc(ref);
                let lista = snap.data().memorias_traumaticas || [];
                lista.push(payload);
                await updateDoc(ref, { memorias_traumaticas: lista });
                alert("¡Evaluación de Memorias Traumáticas guardada en la base de datos con éxito!");
                renderHistory();
            } catch(e) {
                console.error("Error al guardar en Firestore:", e);
            }
        };

        window.imprimirInformeREMT_PDF = function() {
            const f = document.getElementById('trauma-fecha').value || new Date().toLocaleDateString();
            const informeHtml = document.getElementById('informe-ia-box').innerHTML;
            const radarImg = document.getElementById('canvas-radar-trauma').toDataURL();
            const fichaTotal = document.getElementById('tag-trauma-final').innerHTML;

            const win = window.open('', '_blank');
            win.document.write(`
                <html>
                <head>
                    <title>Informe REMT - ${activePatientName}</title>
                    <style>
                        body { font-family: 'Segoe UI', Arial, sans-serif; padding: 40px; color: #111; line-height: 1.5; }
                        .membrete { text-align: right; border-bottom: 3px solid #adff2f; padding-bottom: 10px; margin-bottom: 30px; }
                        .membrete h2 { margin: 0; color: #333; font-size: 18px; }
                        .info-session { background: #f4f4f4; padding: 15px; border-radius: 5px; margin-bottom: 25px; border-left: 5px solid #adff2f; }
                        .radar-wrap { text-align: center; margin: 30px 0; }
                        .ia-box { background: #fff; border: 1px solid #ddd; padding: 20px; border-radius: 5px; }
                        .ficha-resumen { background: #fafafa; border: 1px solid #adff2f; padding: 20px; margin-top: 30px; font-family: monospace; }
                        @media print { .no-print { display: none; } }
                    </style>
                </head>
                <body>
                    <div class="membrete">
                        <h2>Dr. y Mgter. Rubén M. Pereyra</h2>
                        <p style="margin:2px 0; font-size:12px;">Especialista en Psicoterapia Psicoanalítica Focalizada y Neurociencias</p>
                    </div>
                    <div class="info-session">
                        <strong>PACIENTE:</strong> ${activePatientName} | <strong>FECHA:</strong> ${f}
                    </div>
                    <h2 style="text-align:center; color:#333; text-transform:uppercase;">EVALUACIÓN DE MEMORIAS TRAUMÁTICAS (REMT)</h2>
                    <div class="radar-wrap">
                        <img src="${radarImg}" style="max-width: 100%; height: auto; background: #000; border-radius: 8px;">
                        <p style="font-size: 10px; color: #666;">PERFIL DINÁMICO DE CARGA TRAUMÁTICA</p>
                    </div>
                    <div class="ia-box">
                        ${informeHtml}
                    </div>
                    <div class="ficha-resumen">
                        ${fichaTotal}
                    </div>
                    <p style="text-align:center; font-size:9px; color:#999; margin-top:40px;">Documento Clínico Confidencial - Elite 2.0</p>
                </body>
                </html>
            `);
            win.document.close();
        };

        window.cargarHistorialTrauma = async function() {
            activePatientId = document.getElementById('patient-select').value;
            const formCard = document.getElementById('form-card');
            const historyCard = document.getElementById('history-card');

            if (!activePatientId) {
                formCard.style.display = 'none';
                historyCard.style.display = 'none';
                return;
            }

            try {
                const ref = doc(db, "patients", activePatientId);
                const snap = await getDoc(ref);
                if (snap.exists()) {
                    activePatientName = snap.data().name;
                }
            } catch (e) {
                console.error("Error al obtener paciente:", e);
            }

            formCard.style.display = 'block';
            historyCard.style.display = 'block';
            renderHistory();
        }

        async function renderHistory() {
            const container = document.getElementById('history-container');
            container.innerHTML = '<p style="color: #666; font-size: 0.9rem;">Cargando historial...</p>';

            try {
                const ref = doc(db, "patients", activePatientId);
                const snap = await getDoc(ref);
                if (snap.exists()) {
                    const data = snap.data();
                    const historial = data.memorias_traumaticas || [];
                    container.innerHTML = '';
                    
                    if (historial.length === 0) {
                        container.innerHTML = '<p style="color: #666; font-size: 0.9rem;">No hay registros de memorias traumáticas para este paciente.</p>';
                        return;
                    }

                    historial.forEach((item, index) => {
                        const div = document.createElement('div');
                        div.className = 'history-item';
                        div.innerHTML = `
                            <strong>Evaluación #${index + 1} (${item.fecha})</strong> | <strong>Puntaje Total:</strong> ${item.puntajeTotal} / 18
                            <p style="margin-top: 5px; color: var(--accent-color); font-size: 0.85rem;">${item.nivel}</p>
                        `;
                        container.appendChild(div);
                    });
                }
            } catch(e) {
                console.error("Error al cargar historial:", e);
            }
        }

        init();
    </script>
</body>
</html>
