<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva y Balance Neural - ELITE 2.0</title>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #673ab7;
            --bg-dark: #000000;
            --panel-dark: #050505;
            --border-color: #222222;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: #fff; padding: 20px; line-height: 1.4; }

        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: var(--panel-dark); border-radius: 8px; padding: 25px; box-shadow: 0 0 15px rgba(103, 58, 183, 0.1); margin-bottom: 20px; border-top: 4px solid var(--primary-color); }
        h2 { font-size: 1.2rem; color: var(--primary-color); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
        label { font-size: 0.85rem; font-weight: 600; color: var(--primary-color); }
        select, input[type="date"] { padding: 10px 12px; background: #000; color: #fff; border: 1px solid var(--primary-color); border-radius: 4px; font-size: 0.9rem; }
        select:focus, input[type="date"]:focus { outline: none; border-color: #fff; }

        .grid-eval { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 20px; }
        .eval-card { background: #0a0a0a; border: 1px solid var(--border-color); padding: 20px; border-radius: 8px; }
        .eval-card h4 { font-size: 14px; color: var(--primary-color); margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        
        .btn-elite { background: var(--primary-color); color: #fff; border: none; padding: 12px 25px; font-weight: bold; cursor: pointer; border-radius: 4px; text-transform: uppercase; margin: 5px; transition: opacity 0.2s; }
        .btn-elite:hover { opacity: 0.85; }
        .btn-outline-elite { background: transparent; color: var(--primary-color); border: 1px solid var(--primary-color); padding: 12px 25px; font-weight: bold; cursor: pointer; border-radius: 4px; text-transform: uppercase; margin: 5px; }

        @media (max-width: 768px) {
            .grid-eval { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <main class="container">
        <!-- Contenedor principal de la herramienta -->
        <div class="card" id="modalMedidor">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #222; padding-bottom:15px; margin-bottom:20px;">
                <h2><i class="fa-solid fa-brain"></i> MEDIDOR DE RESERVA Y CARGA NEURAL - ELITE 2.0</h2>
            </div>

            <div style="display:flex; gap:20px; background:#0a0a0a; padding:20px; margin-bottom:20px; border:1px solid rgba(103, 58, 183, 0.2);">
                <div style="flex:2;" class="form-group">
                    <label>PACIENTE:</label>
                    <select id="selectPacienteNeural"></select>
                </div>
                <div style="flex:1;" class="form-group">
                    <label>FECHA:</label>
                    <input type="date" id="fechaNeural">
                </div>
            </div>

            <div class="grid-eval">
                <div class="eval-card">
                    <h4>CARGA ALOSTÁTICA (ESTRESULTORES)</h4>
                    <div id="containerCarga"></div>
                </div>
                <div class="eval-card">
                    <h4>RESERVA METABÓLICA / NEURAL</h4>
                    <div id="containerReserva"></div>
                </div>
            </div>

            <div style="display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin:30px 0;">
                <button class="btn-elite" onclick="abrirSimuladorDesdeMedidor()"><i class="fa-solid fa-chart-line"></i> Simular Balance</button>
                <button class="btn-outline-elite" onclick="generarReporteIA()"><i class="fa-solid fa-file-lines"></i> Generar Reporte IA</button>
                <button class="btn-elite" style="background:#2e7d32;" onclick="guardarMedidorNeuralBD()"><i class="fa-solid fa-floppy-disk"></i> Guardar en Base de Datos</button>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCJietA0GuHsUpkN2-lk38Y3L6VDROxvZs",
            authDomain: "materiales-terapeuticos.firebaseapp.com",
            projectId: "materiales-terapeuticos",
            storageBucket: "materiales-terapeuticos.firebasestorage.app",
            messagingSenderId: "827133493876",
            appId: "1:827133493876:web:7d51b4befe64e0f8dfc721"
        };

        const app = initializeApp(firebaseConfig);
        const dbFirestore = getFirestore(app);

        // 1. Abrir y cargar pacientes conectado a Firestore y compatibilidad con objetos globales
        window.abrirMedidorNeural = async function() {
            var selPrintPac = document.getElementById('selectPacienteNeural');
            selPrintPac.innerHTML = '<option value="">-- Cargando pacientes... --</option>';
            
            let listaPacientes = [];

            try {
                const querySnapshot = await getDocs(collection(dbFirestore, "patients"));
                querySnapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const nombre = data.name || data.nombre || data.patientName || "Sin Nombre";
                    listaPacientes.push({ id: docSnap.id, nombre: nombre });
                });
            } catch(e) {
                console.warn("Firestore no accesible directamente, buscando respaldo local.", e);
            }

            if(listaPacientes.length === 0) {
                ["mem", "EPN", "CCRT", "icc"].forEach(k => {
                    let d = JSON.parse(localStorage.getItem(`db_${k}`) || '[]');
                    d.forEach(i => {
                        if(i.p && !listaPacientes.some(p => p.nombre === i.p)) {
                            listaPacientes.push({ id: "local_" + i.p, nombre: i.p });
                        }
                    });
                });
            }

            selPrintPac.innerHTML = '<option value="">-- Seleccionar --</option>';
            listaPacientes.forEach(p => {
                let opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = p.nombre;
                selPrintPac.appendChild(opt);
            });

            document.getElementById('fechaNeural').value = new Date().toISOString().split('T')[0];
            dibujarIndicadores();
        }

        // 2. DIBUJAR LAS CASILLAS DE VERIFICACIÓN
        function dibujarIndicadores() {
            var indC = ["Estrés", "Exigencia Laboral", "Ansiedad", "Rumiación"];
            var indR = ["Calidad de Sueño", "Descanso", "Actividad Física", "Nutrición"];
            
            var htmlC = "";
            for (var i = 0; i < indC.length; i++) {
                htmlC += `<div style="margin-bottom:12px; font-size:13px;"><b>${indC[i]}:</b><br>
                    <input type="radio" name="c${i}" value="0" checked> Adecuada | 
                    <input type="radio" name="c${i}" value="1"> Regular | 
                    <input type="radio" name="c${i}" value="2"> Inadecuada</div>`;
            }
            document.getElementById('containerCarga').innerHTML = htmlC;

            var htmlR = "";
            for (var i = 0; i < indR.length; i++) {
                htmlR += `<div style="margin-bottom:12px; font-size:13px;"><b>${indR[i]}:</b><br>
                    <input type="radio" name="r${i}" value="2"> Adecuada | 
                    <input type="radio" name="r${i}" value="1"> Regular | 
                    <input type="radio" name="r${i}" value="0" checked> Inadecuada</div>`;
            }
            document.getElementById('containerReserva').innerHTML = htmlR;
        }

        // 3. SIMULADOR VISUAL (CON AUTOCREACIÓN DE MODAL)
        window.abrirSimuladorDesdeMedidor = function() {
            if (!document.getElementById('modalSimulador')) {
                var modalHTML = `
                <div id="modalSimulador" style="display:none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.95); align-items: center; justify-content: center; font-family: Arial;">
                    <div style="background-color: #111; color: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 500px; border: 2px solid #ff9800; text-align: center;">
                        <h2 style="color: #ff9800;">🧠 Balance Dinámico Neural</h2>
                        <div id="resultadoTexto" style="font-weight: bold; font-size: 24px; margin-bottom: 15px;">-</div>
                        <div style="background: #333; height: 30px; border-radius: 15px; overflow: hidden; width: 100%; border: 1px solid #555;">
                            <div id="barraProgreso" style="width: 50%; height: 100%; background: linear-gradient(to right, #ff5252, #ffeb3b, #4caf50); transition: width 0.8s;"></div>
                        </div>
                        <p id="explicacionNeuro" style="font-size: 15px; color: #ccc; margin-top: 20px; font-style: italic;"></p>
                        <button onclick="document.getElementById('modalSimulador').style.display='none'" style="margin-top: 20px; padding: 10px 20px; background: #ff9800; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Regresar</button>
                    </div>
                </div>`;
                document.body.insertAdjacentHTML('beforeend', modalHTML);
            }

            var carga = 0, reserva = 0;
            for(var i=0; i<4; i++) {
                var c = document.querySelector(`input[name="c${i}"]:checked`);
                var r = document.querySelector(`input[name="r${i}"]:checked`);
                if(c) carga += parseInt(c.value);
                if(r) reserva += parseInt(r.value);
            }
            
            var balance = reserva - carga;
            document.getElementById('modalSimulador').style.display = 'flex';
            document.getElementById('barraProgreso').style.width = ((balance + 8) / 16 * 100) + "%";
            
            var txt = document.getElementById('resultadoTexto');
            var exp = document.getElementById('explicacionNeuro');
            txt.innerText = "BALANCE: " + (balance > 0 ? "+" : "") + balance;
            txt.style.color = balance <= -3 ? "#ff5252" : (balance >= 3 ? "#4caf50" : "#ffeb3b");
            exp.innerText = balance <= -3 ? "CLAUDICACIÓN NEURAL" : (balance >= 3 ? "RESILIENCIA ÓPTIMA" : "BALANCE FRÁGIL");
        }

        // 4. GENERAR REPORTE PARA IMPRIMIR O PDF
        window.generarReporteIA = function() {
            var select = document.getElementById('selectPacienteNeural');
            var pacienteNombre = select.options[select.selectedIndex].text;
            if (!select.value) { alert("Seleccione un paciente."); return; }

            var carga = 0, reserva = 0;
            for(var i=0; i<4; i++) {
                var c = document.querySelector(`input[name="c${i}"]:checked`);
                var r = document.querySelector(`input[name="r${i}"]:checked`);
                if(c) carga += parseInt(c.value);
                if(r) reserva += parseInt(r.value);
            }
            var balance = reserva - carga;
            var estado = balance <= -3 ? "CLAUDICACIÓN NEURAL" : (balance >= 3 ? "RESILIENCIA ÓPTIMA" : "BALANCE FRÁGIL");

            var win = window.open('', '_blank');
            win.document.write(`
                <html><head><title>Reporte Elite 2.0</title><style>
                    body { font-family: Arial; padding: 40px; background: #fff; color: #333; }
                    .box { border: 2px solid #673ab7; padding: 30px; border-radius: 10px; }
                    h1 { color: #673ab7; text-align: center; margin-top: 0; }
                    .res { font-size: 24px; text-align: center; margin: 20px; font-weight: bold; padding: 10px; border: 1px solid #ccc; }
                    button { background: #673ab7; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
                    @media print { .no-print { display: none; } }
                </style></head><body>
                    <div class="box">
                        <h1>REPORTE DE BALANCE NEURAL</h1>
                        <p><b>Paciente:</b> ${pacienteNombre} | <b>Fecha:</b> ${new Date().toLocaleDateString()}</p>
                        <div class="res">Puntaje Balance: ${balance > 0 ? "+" : ""}${balance} <br> ${estado}</div>
                        <p><b>Análisis:</b> Carga Alostática: ${carga} pts | Reserva Metabólica: ${reserva} pts</p>
                        <hr>
                        <div class="no-print" style="text-align: center; margin-top: 20px;"><button onclick="window.print()">Imprimir o Guardar PDF</button></div>
                    </div>
                </body></html>`);
        }

        // 5. GUARDAR EN BASE DE DATOS DE FIRESTORE
        window.guardarMedidorNeuralBD = async function() {
            var select = document.getElementById('selectPacienteNeural');
            var patientId = select.value;
            var fecha = document.getElementById('fechaNeural').value;

            if (!patientId || patientId.startsWith("local_")) {
                alert("Por favor, seleccione un paciente válido registrado en la base de datos de Firestore.");
                return;
            }

            var carga = 0, reserva = 0;
            for(var i=0; i<4; i++) {
                var c = document.querySelector(`input[name="c${i}"]:checked`);
                var r = document.querySelector(`input[name="r${i}"]:checked`);
                if(c) carga += parseInt(c.value);
                if(r) reserva += parseInt(r.value);
            }
            var balance = reserva - carga;
            var estado = balance <= -3 ? "CLAUDICACIÓN NEURAL" : (balance >= 3 ? "RESILIENCIA ÓPTIMA" : "BALANCE FRÁGIL");

            try {
                const ref = doc(dbFirestore, "patients", patientId);
                const snap = await getDoc(ref);
                let lista = snap.exists() && snap.data().reserva_neural ? snap.data().reserva_neural : [];
                
                lista.push({
                    id: Date.now().toString(),
                    fecha: fecha,
                    cargaAlostatica: carga,
                    reservaMetabolica: reserva,
                    balance: balance,
                    estadoClinico: estado
                });

                await updateDoc(ref, { reserva_neural: lista });
                alert("¡Registro de Reserva y Balance Neural guardado exitosamente en Firestore!");
            } catch (err) {
                console.error("Error al guardar en Firestore:", err);
                alert("Hubo un error al guardar los datos en la base de datos.");
            }
        }

        // Inicializar al cargar la página
        abrirMedidorNeural();
    </script>
</body>
</html>
