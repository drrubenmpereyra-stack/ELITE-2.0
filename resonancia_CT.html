<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECT: Resonancia Contratransferencial - ELITE 7.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #0087ff;
            --bg-dark: #000000;
            --panel-dark: #050505;
            --border-color: #222222;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: #fff; padding: 20px; line-height: 1.4; }

        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: var(--panel-dark); border-radius: 8px; padding: 25px; box-shadow: 0 0 15px rgba(0, 135, 255, 0.1); margin-bottom: 20px; border-top: 4px solid var(--primary-color); }
        h2 { font-size: 1.2rem; color: var(--primary-color); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
        label { font-size: 0.85rem; font-weight: 600; color: var(--primary-color); }
        select, input[type="date"] { padding: 10px 12px; background: #000; color: #fff; border: 1px solid var(--primary-color); border-radius: 4px; font-size: 0.9rem; }
        select:focus, input[type="date"]:focus { outline: none; border-color: #fff; }

        .rect-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 20px; }
        .rect-card { background: #0a0a0a; border: 1px solid var(--border-color); padding: 15px; border-radius: 5px; }
        .ind-header { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
        .rect-input { width: 50px; background: #000; color: #fff; border: 1px solid var(--primary-color); text-align: center; font-weight: bold; padding: 5px; }
        .puntaje-desc { font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .rect-progress { height: 10px; background: #222; border-radius: 5px; margin: 10px 0; overflow: hidden; }
        .rect-bar { height: 100%; width: 0%; transition: 0.3s; }
        .hint-box { font-size: 11px; font-style: italic; margin-bottom: 10px; min-height: 20px; }
        
        .btn-elite { background: var(--primary-color); color: #000; border: none; padding: 12px 25px; font-weight: bold; cursor: pointer; border-radius: 4px; text-transform: uppercase; margin: 5px; transition: opacity 0.2s; }
        .btn-elite:hover { opacity: 0.85; }

        .canvas-container-final { display: flex; justify-content: space-around; gap: 20px; margin: 30px 0; flex-wrap: wrap; }
        .render-rect-box { position: relative; width: 450px; height: 350px; background: #000; border: 1px solid rgba(0, 135, 255, 0.3); border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .render-base { position: absolute; width: 100%; height: 100%; top: 0; left: 0; object-fit: contain !important; opacity: 0.5; }
        .render-layer-box { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .render-layer-box img { position: absolute; width: 100%; height: 100%; top: 0; left: 0; object-fit: contain !important; }
        .canvas-label { background: rgba(0, 135, 255, 0.1); color: var(--primary-color); text-align: center; padding: 10px; font-size: 11px; font-weight: bold; border: 1px solid rgba(0, 135, 255, 0.3); border-radius: 0 0 8px 8px; }

        .c-1 { color: #ff0000 !important; } .bg-1 { background-color: #ff0000 !important; }
        .c-2 { color: #ff8000 !important; } .bg-2 { background-color: #ff8000 !important; }
        .c-3 { color: #ffff00 !important; } .bg-3 { background-color: #ffff00 !important; }
        .c-4 { color: #0087ff !important; } .bg-4 { background-color: #0087ff !important; }
        .c-5 { color: #00ff00 !important; } .bg-5 { background-color: #00ff00 !important; }
        
        #informe-ia-box-rect { background: #050505; border: 1px solid var(--primary-color); padding: 30px; border-radius: 8px; color: #ccc; display: none; margin: 40px 0; line-height: 1.7; }
    </style>
</head>
<body>

    <main class="container">
        <div class="card">
            <h2><i class="fa-solid fa-brain"></i> Resonancia Contratransferencial (RECT) - ELITE 7.0</h2>
            <p style="font-size: 0.85rem; color: #aaa; margin-bottom: 20px;">
                Evaluación integral de la resonancia somática, identificación proyectiva, diferenciación Yo-Otro, función alfa y enacción.
            </p>

            <div style="display:flex; gap:20px; background:#0a0a0a; padding:20px; margin-bottom:20px; border:1px solid rgba(0, 135, 255, 0.2);">
                <div style="flex:2;" class="form-group"><label>PACIENTE:</label><select id="rect-p-select"></select></div>
                <div style="flex:1;" class="form-group"><label>FECHA:</label><input type="date" id="rect-fecha"></div>
            </div>

            <div class="rect-grid"></div>

            <div style="display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin:30px 0;">
                <button class="btn-elite" onclick="graficarRECT_VictoriaFinal()"><i class="fa-solid fa-layer-group"></i> Graficar Mapa Dual</button>
                <button class="btn-elite" onclick="generarInformeIA_RECT_VictoriaFinal()"><i class="fa-solid fa-file-lines"></i> Informe Prospectivo IA</button>
                <button class="btn-elite" style="background:#2ecc71; color:#fff;" onclick="window.imprimirInformeRECT_PDF()"><i class="fa-solid fa-print"></i> Imprimir Informe PDF</button>
            </div>

            <div id="print-area-rect">
                <div class="canvas-container-final">
                    <div>
                        <div class="render-rect-box">
                            <img src="cerebrohuman.jpg" class="render-base" alt="Cerebro Base 1">
                            <div id="render-g1" class="render-layer-box"></div>
                        </div>
                        <div class="canvas-label">MAPA I: RESONANCIA, IP Y DIFERENCIACIÓN</div>
                    </div>
                    <div>
                        <div class="render-rect-box">
                            <img src="cerebrohuman2.jpg" class="render-base" alt="Cerebro Base 2">
                            <div id="render-g2" class="render-layer-box"></div>
                        </div>
                        <div class="canvas-label">MAPA II: FUNCIÓN ALFA Y ENACCIÓN</div>
                    </div>
                </div>
            </div>

            <div id="informe-ia-box-rect"></div>
            <div id="rect-etiqueta-final" style="margin-top:30px; display:flex; justify-content:center;"></div>
            
            <div style="margin:30px 0 0 0;">
                <button onclick="guardarRECT_VictoriaFinal()" style="width:100%;" class="btn-elite"><i class="fa-solid fa-floppy-disk"></i> Guardar Registro Final</button>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCJietA0GuHsUpkN2-lk38Y3L6VDROxvZs",
            authDomain: "materiales-terapeuticos.firebaseapp.com",
            projectId: "materiales-terapeuticos",
            storageBucket: "materiales-terapeuticos.firebasestorage.app",
            messagingSenderId: "827133493876",
            appId: "1:827133493876:web:7d51b4befe64e0f8dfc721"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const rectIndicadores = [
            { titulo: "Resonancia somática", id: "rs", options: [{t:"Opresión", img:"opresion.jpg", target:"g1"}, {t:"Cambio frecuencia cardíaca", img:"opresion.jpg", target:"g1"}, {t:"Tensión muscular", img:"tmuscular.jpg", target:"g1"}]},
            { titulo: "Identificación proyectiva", id: "ip", options: [{t:"Terapeuta siente terror", img:"terror.jpg", target:"g1"}, {t:"Terapeuta siente odio", img:"odio.jpg", target:"g1"}, {t:"Terapeuta siente vacio", img:"vacio.jpg", target:"g1"}]},
            { titulo: "Diferencia Yo-Otro", id: "dyo", options: [{t:"El afecto sentido es comunicación del paciente", img:"afecto.jpg", target:"g1"}]},
            { titulo: "Función alfa", id: "fa", options: [{t:"El terapeuta siente estímulos visuales puros", img:"sensoriales.jpg", target:"g2"}]},
            { titulo: "Uso de la enacción", id: "ue", options: [{t:"Terapeuta actúa la CT", img:"ctsi.jpg", target:"g2"}, {t:"Terapeuta NO actúa la CT", img:"ctno.jpg", target:"g2"}]}
        ];

        async function init() {
            const grid = document.querySelector('.rect-grid');
            grid.innerHTML = rectIndicadores.map(ind => renderInd(ind.titulo, ind.id, ind.options)).join('');

            const sel = document.getElementById('rect-p-select');
            sel.innerHTML = '<option value="">-- Cargando pacientes... --</option>';

            try {
                const querySnapshot = await getDocs(collection(db, "patients"));
                sel.innerHTML = '<option value="">-- Seleccionar Paciente --</option>';
                querySnapshot.forEach((docSnap) => {
                    const pData = docSnap.data();
                    let opt = document.createElement('option');
                    opt.value = docSnap.id;
                    opt.textContent = pData.name || pData.nombre || "Sin Nombre";
                    sel.appendChild(opt);
                });
            } catch (e) {
                console.error("Error al cargar pacientes de Firestore:", e);
                sel.innerHTML = '<option value="">-- Error al cargar pacientes --</option>';
            }
            document.getElementById('rect-fecha').value = new Date().toISOString().split('T')[0];
        }

        function renderInd(titulo, id, options) {
            return `
            <div class="rect-card">
                <div style="color:#0087ff; font-weight:bold; font-size:13px; margin-bottom:10px;">${titulo}</div>
                <div class="ind-header">
                    <input type="number" id="n-${id}" class="rect-input val-num-rect" min="0" max="5" value="0" onchange="updIndRECT_VictoriaFinal('${id}')">
                    <span id="txt-${id}" class="puntaje-desc"></span>
                </div>
                <div class="rect-progress"><div id="b-${id}" class="rect-bar"></div></div>
                <div id="h-${id}" class="hint-box"></div>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    ${options.map((opt, i) => `
                        <label style="font-size:11px; color:#aaa; cursor:pointer; display:flex; align-items:center; gap:6px;">
                            <input type="checkbox" id="ck-${id}-${i}" class="rect-check ck-rect-${id}" 
                                   data-img="${opt.img}" data-target="${opt.target}" disabled onchange="handleSingleCheckRECT_Final('${id}', ${i})"> ${opt.t}
                        </label>`).join('')}
                </div>
            </div>`;
        }

        window.handleSingleCheckRECT_Final = function(grupoId, indexActual) {
            const checks = document.querySelectorAll(`.ck-rect-${grupoId}`);
            const actual = document.getElementById(`ck-${grupoId}-${indexActual}`);
            if(actual.checked) {
                checks.forEach((c, i) => { if(i !== indexActual) c.disabled = true; });
            } else {
                checks.forEach(c => c.disabled = false);
            }
        };

        window.updIndRECT_VictoriaFinal = function(id) {
            const v = parseInt(document.getElementById(`n-${id}`).value) || 0;
            const bar = document.getElementById(`b-${id}`);
            const txt = document.getElementById(`txt-${id}`);
            const hint = document.getElementById(`h-${id}`);
            const cks = document.querySelectorAll(`.ck-rect-${id}`);
            const data = {
                1: { c: "1", t: "1 Ausente/Bloqueada", h: "el terapeuta no registra cambios corporales o afectivos" },
                2: { c: "2", t: "2 Rudimentaria", h: "registro de malestar físico sin conexión vincular" },
                3: { c: "3", t: "3 Emergente", h: "Identificación de afectos crudos, pero dificultad para diferenciar lo propio de lo proyectado" },
                4: { c: "4", t: "4 Integrativa", h: "Capacidad de sentir el afecto y otorgarle un pre-sentido ligado a la historia del paciente" },
                5: { c: "5", t: "5 Simbolizante", h: "Uso fluido de la resonancia para realizar interpretaciones que transforman el afecto en palabra" }
            };
            if(v >= 1 && v <= 5) {
                bar.style.width = (v * 20) + '%'; bar.className = `rect-bar bg-${data[v].c}`;
                txt.innerText = data[v].t; txt.className = `puntaje-desc c-${v}`;
                hint.innerText = "hint: " + data[v].h; hint.className = `hint-box c-${v}`;
                cks.forEach(c => { if(!Array.from(cks).some(x => x.checked && x !== c)) c.disabled = false; });
            } else {
                bar.style.width = '0%'; txt.innerText = ""; hint.innerText = "";
                cks.forEach(c => { c.disabled = true; c.checked = false; });
            }
        };

        window.graficarRECT_VictoriaFinal = () => {
            const r1 = document.getElementById('render-g1'); r1.innerHTML = '';
            const r2 = document.getElementById('render-g2'); r2.innerHTML = '';
            
            document.querySelectorAll('.rect-check:checked').forEach(c => {
                const i = new Image();
                i.src = c.dataset.img;
                Object.assign(i.style, { position: 'absolute', width: '100%', height: '100%', top: '0', left: '0', mixBlendMode: 'screen', objectFit: 'contain' });
                const target = c.dataset.target;
                (target === "g1" ? r1 : r2).appendChild(i);
            });
        };

        window.generarInformeIA_RECT_VictoriaFinal = function() {
            const box = document.getElementById('informe-ia-box-rect');
            let t = 0; document.querySelectorAll('.val-num-rect').forEach(s => t += parseInt(s.value) || 0);
            
            let content = `<h2 style="color:#0087ff; text-align:center; border-bottom:2px solid #0087ff; padding-bottom:15px;">INFORME NEUROPSICOLÓGICO RECT (EXTENSO)</h2>`;

            if (t >= 5 && t <= 12) {
                content += `
                    <h3 style="color:#ff4444;">VALORACIÓN: BLOQUEO DE RESONANCIA O DESBORDAMIENTO</h3>
                    <p><b>Interpretación Neurobiológica:</b> Existe una desconexión defensiva o una incapacidad para procesar la intensidad del afecto no simbolizado. El terapeuta puede estar operando desde una hiperactivación cortical intelectualizada, bloqueando la entrada de señales del sistema límbico y la ínsula. Este estado sugiere que la carga alostática del campo intersubjetivo ha superado la ventana de tolerancia del clínico, resultando en un "congelamiento" de la función alfa.</p>
                    <p><b>Líneas de Intervención Recomendadas:</b><br>
                    • <b>Supervisión Focalizada:</b> Trabajar sobre las resistencias contratransferenciales y el miedo al desborde.<br>
                    • <b>Mindfulness Interoceptivo:</b> Prácticas dirigidas a reconectar con las sensaciones viscerales durante la sesión.<br>
                    • <b>Análisis de la Demanda:</b> Evaluar si el paciente presenta núcleos de trauma desorganizado que están induciendo una identificación proyectiva masiva.</p>`;
            } else if (t <= 19) {
                content += `
                    <h3 style="color:#ffff00;">VALORACIÓN: RESONANCIA EN PROCESO DE SIMBOLIZACIÓN</h3>
                    <p><b>Interpretación Neurobiológica:</b> El clínico siente el impacto emocional y somático (activación de neuronas espejo y sistema somatosensorial), pero la traducción a representaciones verbales es intermitente. Existe una lucha metabólica mental por transformar elementos beta en alfa. El riesgo de acting-out o enacción es elevado, ya que el afecto busca descarga motora antes que procesamiento simbólico.</p>
                    <p><b>Líneas de Intervención Recomendadas:</b><br>
                    • <b>Validación Afectiva:</b> Nombrar el clima emocional de la sesión antes de interpretar ("Siento una atmósfera de gran pesar").<br>
                    • <b>Técnicas de Señalamiento:</b> Utilizar la observación compartida de la contratransferencia para fortalecer el "nosotros" terapéutico.<br>
                    • <b>Monitoreo de Enacción:</b> Estar atento a impulsos de acción que sustituyen al pensamiento.</p>`;
            } else if (t >= 20) {
                content += `
                    <h3 style="color:#00ff00;">VALORACIÓN: ALTA CAPACIDAD DE SIMBOLIZACIÓN RELACIONAL</h3>
                    <p><b>Interpretación Neurobiológica:</b> Se observa una integración óptima entre el cerebro derecho (recepción afectiva) y el izquierdo (codificación lingüística). El clínico actúa como una membrana de transformación efectiva, permitiendo que el paciente experimente sus afectos más crudos a través de un contenedor seguro que los dota de sentido. La comunicación inconsciente fluye sin distorsiones defensivas significativas.</p>
                    <p><b>Líneas de Intervención Recomendadas:</b><br>
                    • <b>Interpretaciones Mutativas:</b> Vincular la experiencia actual con las fallas de simbolización primaria del paciente.<br>
                    • <b>Uso Brújula de la CT:</b> Nombrar lo innombrable con precisión quirúrgica.<br>
                    • <b>Documentación Clínica:</b> Sistematizar el caso como ejemplo de alta operatividad contratransferencial.</p>`;
            }

            content += `<p style="border-top:1px solid #333; padding-top:20px; font-size:12px; color:#aaa; font-style:italic;">Nota Final: Este informe es un apoyo a la supervisión clínica y no sustituye el juicio del profesional a cargo.</p>`;
            box.innerHTML = content; box.style.display = 'block'; box.scrollIntoView({ behavior: 'smooth' });
        };

        window.guardarRECT_VictoriaFinal = async function() {
            const selectP = document.getElementById('rect-p-select');
            const patientId = selectP.value;
            const pName = selectP.options[selectP.selectedIndex]?.text || "N/A";
            const f = document.getElementById('rect-fecha').value;

            if(!patientId) return alert("Seleccione un paciente de la base de datos.");

            let total = 0; let res = ""; let resultadosArray = [];
            const m = {rs:"Resonancia Somática", ip:"Identificación Proyectiva", dyo:"Diferencia Yo-Otro", fa:"Función Alfa", ue:"Uso de Enacción"};
            ['rs','ip','dyo','fa','ue'].forEach(k => {
                let v = document.getElementById(`n-${k}`).value || 0;
                total += parseInt(v);
                const linea = `${m[k]}: ${v}/5 pts`;
                res += `<br>• ${linea}`;
                resultadosArray.push(linea);
            });
            let rango = (total <= 12) ? "BLOQUEO / DESBORDAMIENTO" : (total <= 19) ? "SIMBOLIZACIÓN INTERMITENTE" : "ALTA CAPACIDAD SIMBOLIZANTE";
            
            document.getElementById('rect-etiqueta-final').innerHTML = `
                <div style="border:3px solid #0087ff; background:#000; padding:25px; width:520px; border-radius:12px; box-shadow:0 0 25px #0087ff; font-family:sans-serif; color:white; text-align:center;">
                    <h4 style="color:#0087ff; border-bottom:1px solid #333; margin-top:0; text-transform:uppercase; letter-spacing:1px;">FICHA TÉCNICA RECT - ELITE 7.0</h4>
                    <p style="margin-bottom:15px;"><b>PACIENTE:</b> ${pName} | <b>FECHA:</b> ${f}</p>
                    <div style="font-size:13px; border:1px solid #222; padding:12px; background:#050505; border-radius:6px; text-align:left;">
                        <b>SCORE POR DIMENSIÓN:</b>${res}
                    </div>
                    <div style="background:#111; padding:20px; border-radius:8px; border:1px solid rgba(0, 135, 255, 0.4); margin-top:20px;">
                        <h1 style="color:#0087ff; margin:0; font-size:32px;">TOTAL: ${total}</h1>
                        <p style="font-size:13px; margin-top:10px; font-weight:bold; color:#0087ff;">${rango}</p>
                    </div>
                </div>`;

            try {
                const ref = doc(db, "patients", patientId);
                const snap = await getDoc(ref);
                let lista = snap.exists() && snap.data().resonancia_ct ? snap.data().resonancia_ct : [];
                lista.push({
                    id: Date.now().toString(),
                    fecha: f,
                    puntajeTotal: total,
                    rango: rango,
                    resultados: resultadosArray,
                    informe: document.getElementById('informe-ia-box-rect').innerText
                });
                await updateDoc(ref, { resonancia_ct: lista });
                alert("¡Registro RECT guardado exitosamente en Firestore!");
            } catch(e) {
                console.error("Error al guardar en Firestore:", e);
                alert("Error al guardar el registro en la base de datos.");
            }
        };

        window.imprimirInformeRECT_PDF = function() {
            const selectP = document.getElementById('rect-p-select');
            const p = selectP.options[selectP.selectedIndex]?.text || "Paciente No Seleccionado";
            const f = document.getElementById('rect-fecha').value || new Date().toLocaleDateString();
            const iaContent = document.getElementById('informe-ia-box-rect').innerHTML || "Sin informe generado";
            const totalHtml = document.getElementById('rect-etiqueta-final').innerHTML || "Sin registro final";
            const graphics = document.getElementById('print-area-rect').innerHTML;

            const win = window.open('', '_blank');
            win.document.write(`
                <html>
                <head>
                    <title>Informe RECT - ${p}</title>
                    <style>
                        body { font-family: 'Segoe UI', Arial, sans-serif; padding: 40px; color: #333; }
                        .header { text-align: right; border-bottom: 3px solid #0087ff; padding-bottom: 10px; margin-bottom: 20px; }
                        .header h1 { margin: 0; font-size: 20px; color: #0087ff; }
                        .paciente-info { margin-bottom: 30px; padding: 10px; background: #f0f8ff; border-radius: 5px; }
                        .ia-report { background: #f9f9f9; padding: 20px; border: 1px solid #ddd; border-radius: 8px; margin: 20px 0; }
                        .graphics-container { text-align: center; margin: 30px 0; display: flex; justify-content: center; gap: 20px; }
                        .render-rect-box { position: relative; width: 400px; height: 300px; background: #000; border: 1px solid #0087ff; overflow: hidden; display: flex; align-items: center; justify-content: center; }
                        .render-base { position: absolute; width: 100%; height: 100%; top: 0; left: 0; object-fit: contain !important; opacity: 0.5; }
                        .render-layer-box { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
                        .render-layer-box img { position: absolute; width: 100%; height: 100%; top: 0; left: 0; object-fit: contain !important; }
                        .canvas-label { font-weight: bold; margin-top: 5px; font-size: 12px; text-align: center; }
                        .footer { margin-top: 50px; text-align: center; font-size: 10px; color: #999; border-top: 1px solid #eee; padding-top: 10px; }
                        @media print { .no-print { display: none; } }
                    </style>
                </head>
                <body onload="window.print();">
                    <div class="header">
                        <h1>Dr. y Mgter. Rubén M. Pereyra</h1>
                        <p>Especialista en Psicoterapia Psicoanalítica Focalizada y Neurociencias</p>
                    </div>
                    <div class="paciente-info">
                        <strong>PACIENTE:</strong> ${p} | <strong>FECHA:</strong> ${f}
                    </div>
                    <h2 style="color: #0087ff; text-align: center;">RESONANCIA CONTRATRANSFERENCIAL (RECT)</h2>
                    
                    <div class="ia-report">
                        ${iaContent}
                    </div>

                    <div class="graphics-container">
                        ${graphics}
                    </div>

                    <div style="display: flex; justify-content: center;">
                        ${totalHtml}
                    </div>

                    <div class="footer">
                        Elite 7.0 - Unidad de Convergencia Clínica - 2026
                    </div>
                </body>
                </html>
            `);
            win.document.close();
        };

        init();
    </script>
</body>
</html>
