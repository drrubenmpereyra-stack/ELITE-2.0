<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilo de Intervención y Eficacia de Foco - ELITE 2.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #ca8a04;
            --bg-dark: #000000;
            --panel-dark: #050505;
            --border-color: #222222;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: #fff; padding: 20px; line-height: 1.4; }

        .container { max-width: 900px; margin: 0 auto; }
        .card { background: var(--panel-dark); border-radius: 8px; padding: 25px; box-shadow: 0 0 15px rgba(202, 138, 4, 0.1); margin-bottom: 20px; border-top: 4px solid var(--primary-color); }
        h2 { font-size: 1.2rem; color: var(--primary-color); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
        label { font-size: 0.85rem; font-weight: 600; color: var(--primary-color); }
        input[type="text"], input[type="date"] { padding: 10px 12px; background: #000; color: #fff; border: 1px solid var(--primary-color); border-radius: 4px; font-size: 0.9rem; outline: none; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #000; }
        th { background: #111; color: var(--primary-color); padding: 10px; font-size: 12px; border-bottom: 1px solid var(--border-color); text-align: left; }
        td { padding: 10px; border-bottom: 1px solid var(--border-color); font-size: 13px; }

        .btn-elite { background: var(--primary-color); color: #fff; border: none; padding: 12px 25px; font-weight: bold; cursor: pointer; border-radius: 4px; text-transform: uppercase; margin: 5px; transition: opacity 0.2s; }
        .btn-elite:hover { opacity: 0.85; }
        .btn-outline-elite { background: transparent; color: var(--primary-color); border: 1px solid var(--primary-color); padding: 12px 25px; font-weight: bold; cursor: pointer; border-radius: 4px; text-transform: uppercase; margin: 5px; }

        .ae-bar-bg { width: 100%; background: #222; height: 10px; border-radius: 5px; overflow: hidden; }
        .ae-bar-fill { height: 100%; width: 20%; transition: width 0.3s; }

        #res-ia-est-box { background: #050505; border: 1px solid var(--primary-color); padding: 25px; margin-top: 15px; font-size: 12px; line-height: 1.6; border-radius: 6px; color: #ccc; display: none; }
        .historial-box { background: #0a0a0a; border: 1px solid #222; padding: 15px; margin-top: 15px; border-radius: 4px; font-size: 12px; }
        .tooltip-ae { position: relative; cursor: help; }
        .tooltip-ae .tooltiptext-ae { visibility: hidden; width: 220px; background-color: #111; color: #fff; text-align: center; border-radius: 6px; padding: 6px; position: absolute; z-index: 1; bottom: 125%; left: 50%; transform: translateX(-50%); opacity: 0; transition: opacity 0.3s; font-size: 11px; border: 1px solid var(--primary-color); }
        .tooltip-ae:hover .tooltiptext-ae { visibility: visible; opacity: 1; }
    </style>
</head>
<body>

    <main class="container">
        <div class="card" id="est-container">
            <h2><i class="fa-solid fa-bullseye"></i> ESTILO DE INTERVENCIÓN Y EFICACIA DE FOCO - ELITE 2.0</h2>

            <div style="display:flex; gap:20px; background:#0a0a0a; padding:20px; margin-bottom:20px; border:1px solid rgba(202, 138, 4, 0.2);">
                <div style="flex:2;" class="form-group">
                    <label>NOMBRE DEL TERAPEUTA:</label>
                    <input type="text" id="est-terapeuta" placeholder="Ingrese nombre del terapeuta">
                </div>
                <div style="flex:1;" class="form-group">
                    <label>FECHA:</label>
                    <input type="date" id="est-fecha">
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>CATEGORÍA DE INTERVENCIÓN</th>
                        <th style="width:100px; text-align:center;">FREQ (1-5)</th>
                        <th style="width:200px;">DINAMISMO VISUAL</th>
                    </tr>
                </thead>
                <tbody id="tabla-estilo-master-body"></tbody>
            </table>

            <div style="display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin-top:25px;">
                <button class="btn-elite" onclick="analizarEstiloIA()"><i class="fa-solid fa-robot"></i> Informe IA</button>
                <button class="btn-elite" style="background:#16a34a;" onclick="guardarEstiloRegistro()"><i class="fa-solid fa-floppy-disk"></i> Guardar Registro</button>
                <button class="btn-outline-elite" onclick="guardarPDFEst()"><i class="fa-solid fa-file-pdf"></i> Guardar PDF</button>
            </div>

            <div id="res-ia-est-box"></div>

            <div class="historial-box">
                <h4 style="color: var(--primary-color); margin-bottom: 8px; font-size: 13px;">REGISTROS GUARDADOS</h4>
                <div id="lista-est-hist">Sin registros aún.</div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCJietA0GuHsUpkN2-lk38Y3L6VDROxvZs",
            authDomain: "materiales-terapeuticos.firebaseapp.com",
            projectId: "materiales-terapeuticos",
            storageBucket: "materiales-terapeuticos.firebasestorage.app",
            messagingSenderId: "827133493876",
            appId: "1:827133493876:web:7d51b4befe64e0f8dfc721"
        };

        const app = initializeApp(firebaseConfig);
        const dbFirestore = getFirestore(app);

        const d_Est = [
            {cat: 'Interrogación', h: 'Preguntas para ampliar el campo informativo.'},
            {cat: 'Información', h: 'Aporte de datos sobre realidad.'},
            {cat: 'Confirmación / Rectificación', h: 'Validar visión o corregir distorsiones.'},
            {cat: 'Clarificación', h: 'Reformular nexos.'},
            {cat: 'Recapitulación', h: 'Resumen integrador.'},
            {cat: 'Señalamiento', h: 'Notar lo no advertido.'},
            {cat: 'Interpretación', h: 'Explicar sentidos latentes.'},
            {cat: 'Sugerencia / Encuadre', h: 'Propuestas de acción.'},
            {cat: 'Intervenciones de Apoyo', h: 'Refuerzo de alianza y Yo.'}
        ];

        let db_E = JSON.parse(localStorage.getItem('DB_AE_EST_ELITE')) || [];

        function initEst() {
            document.getElementById('est-fecha').value = new Date().toISOString().split('T')[0];
            const tbody = document.getElementById('tabla-estilo-master-body');
            tbody.innerHTML = d_Est.map((d, i) => `
                <tr>
                    <td class="tooltip-ae"><b>${d.cat}</b> ⓘ <span class="tooltiptext-ae">${d.h}</span></td>
                    <td style="text-align:center;"><input type="number" value="1" min="1" max="5" oninput="updBarAE(${i}, this.value)" id="e-freq-${i}" style="width:60px; padding:5px; text-align:center; background:#000; color:#fff; font-weight:bold; border:1px solid var(--primary-color); border-radius:4px;"></td>
                    <td>
                        <div class="ae-bar-bg">
                            <div id="ae-bar-${i}" class="ae-bar-fill" style="width:20%; background:#ef4444;"></div>
                        </div>
                    </td>
                </tr>
            `).join('');
            updHistList();
        }

        window.updBarAE = function(i, v) {
            let b = document.getElementById('ae-bar-'+i);
            b.style.width = (v * 20) + '%';
            b.style.background = ["#ef4444", "#f97316", "#eab308", "#84cc16", "#22c55e"][v - 1];
        };

        window.analizarEstiloIA = function() {
            let s = 0; 
            for(let i=0; i<d_Est.length; i++) {
                s += parseInt(document.getElementById('e-freq-'+i).value) || 1;
            }
            const box = document.getElementById('res-ia-est-box');
            box.style.display = 'block';
            box.innerHTML = `<strong>Informe IA (Eficacia Focal: ${s}/45):</strong><br>${s > 35 ? 'Alta precisión en el encuadre y focalización dinámica operativa.' : 'Focalización en desarrollo. Se recomienda equilibrar señalamientos e interpretaciones.'}`;
        };

        window.guardarEstiloRegistro = async function() {
            const t = document.getElementById('est-terapeuta').value.trim();
            const f = document.getElementById('est-fecha').value;
            if(!t || !f) { alert('Complete el nombre del terapeuta y la fecha.'); return; }

            let s = 0; 
            for(let i=0; i<d_Est.length; i++) {
                s += parseInt(document.getElementById('e-freq-'+i).value) || 1;
            }

            const nuevoReg = { id: Date.now().toString(), n: t, f, s };
            db_E.push(nuevoReg);
            localStorage.setItem('DB_AE_EST_ELITE', JSON.stringify(db_E));
            updHistList();
            alert('¡Registro de Estilo e Intervención guardado correctamente!');
        };

        function updHistList() {
            const l = document.getElementById('lista-est-hist');
            if(db_E.length === 0) { l.innerHTML = 'Sin registros aún.'; return; }
            l.innerHTML = db_E.slice().reverse().map(r => `
                <div style="padding:8px; border-bottom:1px solid #222; color:#ccc; display:flex; justify-content:space-between;">
                    <span>📅 <b>${r.f}</b> | Terapeuta: <b>${r.n}</b></span>
                    <span style="color:var(--primary-color); font-weight:bold;">Puntaje: ${r.s}/45</span>
                </div>
            `).join('');
        }

        window.guardarPDFEst = function() {
            const t = document.getElementById('est-terapeuta').value;
            if(!t) { alert("Ingrese el nombre del terapeuta primero."); return; }
            const element = document.getElementById('est-container');
            const opt = { margin: 0.4, filename: `Estilo_Intervencion_${t.replace(/\s+/g, '_')}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, backgroundColor: '#050505' }, jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' } };
            html2pdf().set(opt).from(element).save();
        };

        initEst();
    </script>
</body>
</html>
