<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoevaluación: Alianza Terapéutica - ELITE 2.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1e40af;
            --bg-dark: #000000;
            --panel-dark: #050505;
            --border-color: #222222;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: #fff; padding: 20px; line-height: 1.4; }

        .container { max-width: 900px; margin: 0 auto; }
        .card { background: var(--panel-dark); border-radius: 8px; padding: 25px; box-shadow: 0 0 15px rgba(30, 64, 175, 0.1); margin-bottom: 20px; border-top: 4px solid var(--primary-color); }
        h2 { font-size: 1.2rem; color: var(--primary-color); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
        label { font-size: 0.85rem; font-weight: 600; color: var(--primary-color); }
        select, input[type="date"] { padding: 10px 12px; background: #000; color: #fff; border: 1px solid var(--primary-color); border-radius: 4px; font-size: 0.9rem; outline: none; }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; margin-top: 15px; background: #000; }
        th { background: #111; color: var(--primary-color); padding: 10px; font-size: 12px; border-bottom: 1px solid var(--border-color); text-align: left; }
        td { padding: 10px; border-bottom: 1px solid var(--border-color); font-size: 13px; }

        .btn-elite { background: var(--primary-color); color: #fff; border: none; padding: 12px 25px; font-weight: bold; cursor: pointer; border-radius: 4px; text-transform: uppercase; margin: 5px; transition: opacity 0.2s; }
        .btn-elite:hover { opacity: 0.85; }
        .btn-outline-elite { background: transparent; color: var(--primary-color); border: 1px solid var(--primary-color); padding: 12px 25px; font-weight: bold; cursor: pointer; border-radius: 4px; text-transform: uppercase; margin: 5px; }

        #res-ia-ali-box { background: #050505; border-left: 10px solid var(--primary-color); padding: 25px; margin-top: 15px; font-size: 12px; line-height: 1.6; border-radius: 6px; color: #ccc; display: none; }
        .historial-box { background: #0a0a0a; border: 1px solid #222; padding: 15px; margin-top: 15px; border-radius: 4px; font-size: 12px; }
        .tooltip-ae { position: relative; cursor: help; }
        .tooltip-ae .tooltiptext-ae { visibility: hidden; width: 220px; background-color: #111; color: #fff; text-align: center; border-radius: 6px; padding: 6px; position: absolute; z-index: 1; bottom: 125%; left: 50%; transform: translateX(-50%); opacity: 0; transition: opacity 0.3s; font-size: 11px; border: 1px solid var(--primary-color); }
        .tooltip-ae:hover .tooltiptext-ae { visibility: visible; opacity: 1; }
    </style>
</head>
<body>

    <main class="container">
        <div class="card" id="ali-container">
            <h2><i class="fa-solid fa-handshake"></i> ALIANZA TERAPÉUTICA: ESCALA CROMÁTICA - ELITE 2.0</h2>

            <div style="display:flex; gap:20px; background:#0a0a0a; padding:20px; margin-bottom:20px; border:1px solid rgba(30, 64, 175, 0.2);">
                <div style="flex:2;" class="form-group">
                    <label>PACIENTE (BASE DE DATOS / LOCAL):</label>
                    <select id="ali-paciente-id" onchange="mostrarHistorialAlianza(this.value)" style="width:100%; padding:10px; border:2px solid #3b82f6; border-radius:6px; color:#fff; background:#000; font-weight:bold;"></select>
                </div>
                <div style="flex:1;" class="form-group">
                    <label>FECHA:</label>
                    <input type="date" id="ali-fecha-val">
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Dimensión</th>
                        <th style="text-align:center;">Insuficiente (1)</th>
                        <th style="text-align:center;">En Desarrollo (2)</th>
                        <th style="text-align:center;">Competente (3)</th>
                        <th style="text-align:center;">Excelente (4)</th>
                    </tr>
                </thead>
                <tbody id="tabla-alianza-master-body"></tbody>
            </table>

            <div style="display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin-top:25px;">
                <button class="btn-elite" onclick="analizarAlianzaIA()"><i class="fa-solid fa-robot"></i> Informe IA</button>
                <button class="btn-elite" style="background:#16a34a;" onclick="guardarAlianzaRegistro()"><i class="fa-solid fa-floppy-disk"></i> Guardar Registro</button>
                <button class="btn-outline-elite" onclick="guardarPDFAli()"><i class="fa-solid fa-file-pdf"></i> Guardar PDF</button>
            </div>

            <div id="res-ia-ali-box"></div>

            <div class="historial-box">
                <h4 style="color: var(--primary-color); margin-bottom: 8px; font-size: 13px;">HISTORIAL DEL PACIENTE</h4>
                <div id="lista-ali-hist">Seleccione un paciente para ver su historial.</div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCJietA0GuHsUpkN2-lk38Y3L6VDROxvZs",
            authDomain: "materiales-terapeuticos.firebaseapp.com",
            projectId: "materiales-terapeuticos",
            storageBucket: "materiales-terapeuticos.firebasestorage.app",
            messagingSenderId: "827133493876",
            appId: "1:827133493876:web:7d51b4befe64e0f8dfc721"
        };

        const app = initializeApp(firebaseConfig);
        const dbFirestore = getFirestore(app);

        const d_Ali = [
            {id:'sin', n:'Sintonía y Empatía', h:["Falta conexión. Defensivo.","Validación mecánica.","Calidez y respeto.","Sincronía profunda (Polivagal)."]},
            {id:'obj', n:'Consenso de Objetivos', h:["Metas divergentes.","Objetivos vagos.","Objetivos claros.","Apropiación total."]},
            {id:'tar', n:'Acuerdos de Tareas', h:["Rechaza intervenciones.","Escepticismo.","Comprensión activa.","Proactividad total."]},
            {id:'rup', n:'Reparación Rupturas', h:["Ignoradas o escaladas.","Abordaje superficial.","Diálogo técnico.","Fortalece el vínculo."]},
            {id:'neu', n:'Regulación Neuroafectiva', h:["Hiperalerta/Disociación.","Inestable.","Ventana de tolerancia.","Regulador externo."]}
        ];

        let db_A = JSON.parse(localStorage.getItem('DB_AE_ALI_ELITE')) || [];

        window.initAli = async function() {
            document.getElementById('ali-fecha-val').value = new Date().toISOString().split('T')[0];
            const sel = document.getElementById('ali-paciente-id');
            sel.innerHTML = '<option value="">Cargando pacientes...</option>';
            let listaPacientes = [];

            try {
                const querySnapshot = await getDocs(collection(dbFirestore, "patients"));
                querySnapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    listaPacientes.push({ id: docSnap.id, nombre: data.name || data.nombre || "Sin Nombre" });
                });
            } catch(e) { console.warn("Firestore inaccesible, usando respaldo local.", e); }

            if(listaPacientes.length === 0) {
                ["mem", "EPN", "CCRT", "icc"].forEach(k => {
                    let d = JSON.parse(localStorage.getItem(`db_${k}`) || '[]');
                    d.forEach(i => { if(i.p && !listaPacientes.some(p => p.nombre === i.p)) listaPacientes.push({ id: "local_" + i.p, nombre: i.p }); });
                });
            }

            sel.innerHTML = '<option value="">-- Buscar Paciente --</option>';
            listaPacientes.forEach(p => { sel.innerHTML += `<option value="${p.id}">${p.nombre.toUpperCase()}</option>`; });

            const tbody = document.getElementById('tabla-alianza-master-body');
            tbody.innerHTML = d_Ali.map(d => `
                <tr>
                    <td style="font-weight:bold; color:var(--primary-color);">${d.n}</td>
                    ${d.h.map((hint, i) => `
                        <td class="tooltip-ae" style="text-align:center;">
                            <input type="radio" name="${d.id}" value="${i+1}" style="accent-color:var(--primary-color); transform:scale(1.2);">
                            <span class="tooltiptext-ae">${hint}</span>
                        </td>
                    `).join('')}
                </tr>
            `).join('');
        };

        window.mostrarHistorialAlianza = function(pid) {
            const f = db_A.filter(r => r.pid == pid);
            const l = document.getElementById('lista-ali-hist');
            if(!pid) { l.innerHTML = 'Seleccione un paciente para ver su historial.'; return; }
            if(f.length === 0) { l.innerHTML = 'Sin registros previos para este paciente.'; return; }
            l.innerHTML = f.slice().reverse().map(r => `
                <div style="padding:8px; border-bottom:1px solid #222; color:#ccc; display:flex; justify-content:space-between;">
                    <span>📅 <b>${r.f}</b></span>
                    <span style="color:var(--primary-color); font-weight:bold;">Puntaje: ${r.s}/20</span>
                </div>
            `).join('');
        };

        window.analizarAlianzaIA = function() {
            const sel = document.querySelectorAll('#ali-container input:checked');
            if(sel.length < d_Ali.length) { alert('Complete todas las dimensiones de alianza.'); return; }
            let s = 0; sel.forEach(r => s += parseInt(r.value));
            const box = document.getElementById('res-ia-ali-box');
            box.style.display = 'block';
            box.innerHTML = `<strong>Informe IA: Puntaje Total ${s}/20</strong><br>${s >= 18 ? 'Alianza Óptima. Sintonía profunda y objetivos compartidos consolidados.' : 'Se detectan áreas de cortocircuito vincular. Se sugiere reparación activa de rupturas y revisión de tareas.'}`;
        };

        window.guardarAlianzaRegistro = async function() {
            const pid = document.getElementById('ali-paciente-id').value;
            const f = document.getElementById('ali-fecha-val').value;
            const sel = document.querySelectorAll('#ali-container input:checked');

            if(!pid || !f || sel.length < d_Ali.length) { alert('Seleccione un paciente, fecha y complete todas las dimensiones.'); return; }
            let s = 0; sel.forEach(r => s += parseInt(r.value));

            const nuevoReg = { id: Date.now().toString(), pid, f, s };
            db_A.push(nuevoReg);
            localStorage.setItem('DB_AE_ALI_ELITE', JSON.stringify(db_A));
            mostrarHistorialAlianza(pid);
            alert('¡Registro de Alianza Terapéutica guardado correctamente!');
        };

        window.guardarPDFAli = function() {
            const sel = document.getElementById('ali-paciente-id');
            if (!sel.value) { alert("Seleccione un paciente primero."); return; }
            const pacText = sel.options[sel.selectedIndex].text;
            const element = document.getElementById('ali-container');
            const opt = { margin: 0.4, filename: `Alianza_Terapeutica_${pacText.replace(/\s+/g, '_')}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, backgroundColor: '#050505' }, jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' } };
            html2pdf().set(opt).from(element).save();
        };

        initAli();
    </script>
</body>
</html>
