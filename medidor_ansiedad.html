<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECA: Rúbrica de Evaluación Clínica de Ansiedad - ELITE 2.0</title>
    <!-- Chart.js para el gráfico de radar -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- html2pdf para la exportación a PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #673ab7;
            --bg-dark: #000000;
            --panel-dark: #050505;
            --border-color: #222222;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: #fff; padding: 20px; line-height: 1.4; }

        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: var(--panel-dark); border-radius: 8px; padding: 25px; box-shadow: 0 0 15px rgba(103, 58, 183, 0.1); margin-bottom: 20px; border-top: 4px solid var(--primary-color); }
        h2 { font-size: 1.2rem; color: var(--primary-color); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
        label { font-size: 0.85rem; font-weight: 600; color: var(--primary-color); }
        select, input[type="date"] { padding: 10px 12px; background: #000; color: #fff; border: 1px solid var(--primary-color); border-radius: 4px; font-size: 0.9rem; }
        select:focus, input[type="date"]:focus { outline: none; border-color: #fff; }

        .reca-f { display: grid; grid-template-columns: 2.5fr 1fr 1fr 1fr; gap: 10px; align-items: center; border-bottom: 1px solid var(--border-color); padding: 12px 0; }
        .reca-h { cursor: help; font-weight: bold; border-bottom: 1px dotted var(--primary-color); color: #ddd; font-size: 13px; }
        .reca-r { width: 22px; height: 22px; cursor: help; accent-color: var(--primary-color); margin: auto; }

        .btn-elite { background: var(--primary-color); color: #fff; border: none; padding: 12px 25px; font-weight: bold; cursor: pointer; border-radius: 4px; text-transform: uppercase; margin: 5px; transition: opacity 0.2s; }
        .btn-elite:hover { opacity: 0.85; }
        .btn-outline-elite { background: transparent; color: var(--primary-color); border: 1px solid var(--primary-color); padding: 12px 25px; font-weight: bold; cursor: pointer; border-radius: 4px; text-transform: uppercase; margin: 5px; }

        .chart-container { display: flex; justify-content: center; align-items: center; margin: 20px 0; background: #000; padding: 15px; border: 1px solid rgba(103,58,183,0.3); border-radius: 8px; }
        .chart-wrapper { width: 320px; height: 320px; position: relative; }

        #reca_res { background: #080808; border-left: 5px solid var(--primary-color); padding: 15px; margin-top: 15px; font-size: 14px; border-radius: 0 6px 6px 0; color: #ccc; }

        @media (max-width: 768px) {
            .reca-f { grid-template-columns: 1fr; gap: 5px; }
        }
    </style>
</head>
<body>

    <main class="container">
        <!-- Contenedor principal que abarca todo el contenido y PDF -->
        <div class="card" id="RECA_Container">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #222; padding-bottom:15px; margin-bottom:20px;">
                <h2><i class="fa-solid fa-heart-pulse"></i> RECA: Rúbrica de Evaluación Clínica de Ansiedad - ELITE 2.0</h2>
            </div>

            <div style="display:flex; gap:20px; background:#0a0a0a; padding:20px; margin-bottom:20px; border:1px solid rgba(103, 58, 183, 0.2);">
                <div style="flex:2;" class="form-group">
                    <label>BUSCADOR DE PACIENTES (ELITE DB):</label>
                    <select id="RECA_PacSel"></select>
                </div>
                <div style="flex:1;" class="form-group">
                    <label>FECHA:</label>
                    <input type="date" id="fechaAnsiedad">
                </div>
            </div>

            <div style="display:grid; grid-template-columns: 1.2fr 0.8fr; gap:35px;">
                <div id="RECA_Form" style="background:#0a0a0a; border:1px solid var(--border-color); padding:20px; border-radius:8px;">
                    <div class="reca-f" style="background:#111; color:#fff; font-weight:bold; text-align:center; font-size:11px; border-radius:5px 5px 0 0; padding:10px 0;">
                        <div>INDICADOR</div><div>LEVE (1)</div><div>MODERADO (2)</div><div>SEVERO (3)</div>
                    </div>

                    <div class="reca-f">
                        <span class="reca-h" title="Reactividad Neurovegetativa: Evaluación de la respuesta física del sistema nervioso.">1. Reactividad Física ℹ️</span>
                        <input type="radio" name="rv1" value="1" checked class="reca-r" title="LEVE: Tensión leve, recuperación rápida tras estresor.">
                        <input type="radio" name="rv1" value="2" class="reca-r" title="MODERADO: Taquicardia, opresión torácica, alteraciones del sueño.">
                        <input type="radio" name="rv1" value="3" class="reca-r" title="SEVERO: Crisis de pánico, temblores o parestesias constantes.">
                    </div>

                    <div class="reca-f">
                        <span class="reca-h" title="Sesgo Cognitivo: Patrones de pensamiento y rumiación.">2. Sesgo Cognitivo ℹ️</span>
                        <input type="radio" name="rv2" value="1" checked class="reca-r" title="LEVE: Preocupaciones realistas y controlables.">
                        <input type="radio" name="rv2" value="2" class="reca-r" title="MODERADO: Rumiación constante 'qué pasaría si...'. Dificultad para desconectar.">
                        <input type="radio" name="rv2" value="3" class="reca-r" title="SEVERO: Pensamiento catastrófico crónico. Pérdida de concentración.">
                    </div>

                    <div class="reca-f">
                        <span class="reca-h" title="Regulación Emocional: Capacidad de gestión del afecto ansioso.">3. Regulación Emocional ℹ️</span>
                        <input type="radio" name="rv3" value="1" checked class="reca-r" title="LEVE: Uso de estrategias saludables (deporte, respiración).">
                        <input type="radio" name="rv3" value="2" class="reca-r" title="MODERADO: Irritabilidad, desbordes ocasionales o llanto ante presión.">
                        <input type="radio" name="rv3" value="3" class="reca-r" title="SEVERO: Bloqueo emocional o explosiones de ira/angustia incontrolables.">
                    </div>

                    <div class="reca-f">
                        <span class="reca-h" title="Conducta de Evitación: Impacto en la libertad de movimiento del paciente.">4. Evitación/Conducta ℹ️</span>
                        <input type="radio" name="rv4" value="1" checked class="reca-r" title="LEVE: Enfrenta situaciones aunque con incomodidad subjetiva.">
                        <input type="radio" name="rv4" value="2" class="reca-r" title="MODERADO: Evita situaciones específicas (sociales, laborales).">
                        <input type="radio" name="rv4" value="3" class="reca-r" title="SEVERO: Aislamiento significativo. Impacto funcional total.">
                    </div>

                    <div class="reca-f" style="border-bottom:none;">
                        <span class="reca-h" title="Autoeficacia: Percepción de recursos propios para afrontar retos.">5. Autoeficacia ℹ️</span>
                        <input type="radio" name="rv5" value="1" checked class="reca-r" title="LEVE: Confianza en sus habilidades a pesar del miedo.">
                        <input type="radio" name="rv5" value="2" class="reca-r" title="MODERADO: Duda constante. Dependencia de terceros para decidir.">
                        <input type="radio" name="rv5" value="3" class="reca-r" title="SEVERO: Indefensión aprendida. El entorno es una amenaza total.">
                    </div>

                    <button class="btn-elite" onclick="RECA_SISTEMA.medir()" style="width:100%; margin-top:20px;"><i class="fa-solid fa-chart-pie"></i> Medir (Polígono)</button>
                </div>

                <div style="background:#0a0a0a; padding:20px; border-radius:8px; border:1px solid var(--border-color); display:flex; flex-direction:column; justify-content:space-between;">
                    <div class="chart-container">
                        <div class="chart-wrapper">
                            <canvas id="reca_chart"></canvas>
                        </div>
                    </div>
                    
                    <div id="reca_res">
                        <i>Realice la medición para interpretar resultados...</i>
                    </div>

                    <div style="margin-top:20px; display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;">
                        <button class="btn-elite" style="background:#4527a0;" onclick="RECA_SISTEMA.ia()"><i class="fa-solid fa-robot"></i> Informe IA</button>
                        <button class="btn-elite" style="background:#2c3e50;" onclick="RECA_SISTEMA.guardarBD()"><i class="fa-solid fa-floppy-disk"></i> Guardar BD</button>
                        <button class="btn-elite" style="background:#27ae60;" onclick="RECA_SISTEMA.pdf()"><i class="fa-solid fa-file-pdf"></i> Guardar PDF</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCJietA0GuHsUpkN2-lk38Y3L6VDROxvZs",
            authDomain: "materiales-terapeuticos.firebaseapp.com",
            projectId: "materiales-terapeuticos",
            storageBucket: "materiales-terapeuticos.firebasestorage.app",
            messagingSenderId: "827133493876",
            appId: "1:827133493876:web:7d51b4befe64e0f8dfc721"
        };

        const app = initializeApp(firebaseConfig);
        const dbFirestore = getFirestore(app);

        let ultimoCalculoAnsiedad = { valores: [], total: 0, categoria: "", informeIA: "" };

        async function initAnsiedad() {
            const sel = document.getElementById('RECA_PacSel');
            sel.innerHTML = '<option value="">Cargando pacientes...</option>';
            
            let listaPacientes = [];

            try {
                const querySnapshot = await getDocs(collection(dbFirestore, "patients"));
                querySnapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const nombre = data.name || data.nombre || data.patientName || "Sin Nombre";
                    listaPacientes.push({ id: docSnap.id, nombre: nombre });
                });
            } catch(e) {
                console.warn("Firestore no accesible directamente, buscando respaldo local.", e);
            }

            if(listaPacientes.length === 0) {
                ["mem", "EPN", "CCRT", "icc"].forEach(k => {
                    let d = JSON.parse(localStorage.getItem(`db_${k}`) || '[]');
                    d.forEach(i => {
                        if(i.p && !listaPacientes.some(p => p.nombre === i.p)) {
                            listaPacientes.push({ id: "local_" + i.p, nombre: i.p });
                        }
                    });
                });
            }

            sel.innerHTML = '<option value="">-- Seleccionar Paciente --</option>';
            if(listaPacientes.length > 0) {
                listaPacientes.forEach(p => {
                    let opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = p.nombre;
                    sel.appendChild(opt);
                });
            } else {
                sel.innerHTML = '<option value="">No se encontraron pacientes</option>';
            }

            document.getElementById('fechaAnsiedad').value = new Date().toISOString().split('T')[0];
        }

        window.RECA_SISTEMA = {
            chart: null,

            medir: function() {
                const v = [
                    parseInt(document.querySelector('input[name="rv1"]:checked').value),
                    parseInt(document.querySelector('input[name="rv2"]:checked').value),
                    parseInt(document.querySelector('input[name="rv3"]:checked').value),
                    parseInt(document.querySelector('input[name="rv4"]:checked').value),
                    parseInt(document.querySelector('input[name="rv5"]:checked').value)
                ];

                const total = v.reduce((a, b) => a + b, 0);
                let cat = total <= 7 ? "Ansiedad Leve" : (total <= 11 ? "Ansiedad Moderada" : "Ansiedad Severa");
                let col = total <= 7 ? "#27ae60" : (total <= 11 ? "#f1c40f" : "#e74c3c");

                ultimoCalculoAnsiedad = {
                    valores: v,
                    total: total,
                    categoria: cat,
                    informeIA: ""
                };

                document.getElementById('reca_res').innerHTML = `<b>Puntaje Total: ${total}/15</b><br>Categoría: <span style="color:${col}; font-weight:bold;">${cat}</span>`;
                document.getElementById('reca_res').style.borderLeftColor = col;

                // Render Gráfico Polígono (Radar)
                const ctx = document.getElementById('reca_chart').getContext('2d');
                if (this.chart) this.chart.destroy();
                this.chart = new Chart(ctx, {
                    type: 'radar',
                    data: {
                        labels: ['Física', 'Cognitiva', 'Emocional', 'Evitación', 'Autoeficacia'],
                        datasets: [{
                            label: 'Perfil de Ansiedad',
                            data: v,
                            backgroundColor: 'rgba(103, 58, 183, 0.4)',
                            borderColor: '#673ab7',
                            borderWidth: 2,
                            pointBackgroundColor: col
                        }]
                    },
                    options: { 
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: { 
                            r: { 
                                min: 0, 
                                max: 3, 
                                ticks: { stepSize: 1, color: '#aaa', backdropColor: 'transparent' },
                                grid: { color: '#333' },
                                angleLines: { color: '#333' },
                                pointLabels: { color: '#fff', font: { weight: 'bold', size: 11 } }
                            } 
                        },
                        plugins: { legend: { display: false } }
                    }
                });
            },

            ia: function() {
                const res = document.getElementById('reca_res');
                if (res.innerText.includes("resultados") || !ultimoCalculoAnsiedad.categoria) {
                    alert("Realice la medición primero.");
                    return;
                }
                
                let informeIA = "<hr style='margin:10px 0; border:0; border-top:1px solid #333;'><b>Interpretación Neurobiológica:</b> El puntaje sugiere una hiperactividad de la amígdala con hipofunción de la corteza prefrontal. Se recomienda intervención en regulación emocional 'Bottom-Up'.";
                ultimoCalculoAnsiedad.informeIA = informeIA;
                res.innerHTML += informeIA;
            },

            guardarBD: async function() {
                const sel = document.getElementById('RECA_PacSel');
                const patientId = sel.value;
                const fecha = document.getElementById('fechaAnsiedad').value;

                if (!patientId || patientId.startsWith("local_")) {
                    alert("Por favor, seleccione un paciente válido registrado en la base de datos de Firestore.");
                    return;
                }

                if (!ultimoCalculoAnsiedad.categoria) {
                    alert("Debe realizar la medición de ansiedad antes de guardar.");
                    return;
                }

                try {
                    const ref = doc(dbFirestore, "patients", patientId);
                    const snap = await getDoc(ref);
                    let lista = snap.exists() && snap.data().medidor_ansiedad ? snap.data().medidor_ansiedad : [];
                    
                    lista.push({
                        id: Date.now().toString(),
                        fecha: fecha,
                        puntajeTotal: ultimoCalculoAnsiedad.total,
                        categoria: ultimoCalculoAnsiedad.categoria,
                        indicadores: {
                            reactividadFisica: ultimoCalculoAnsiedad.valores[0],
                            sesgoCognitivo: ultimoCalculoAnsiedad.valores[1],
                            regulacionEmocional: ultimoCalculoAnsiedad.valores[2],
                            evitacionConducta: ultimoCalculoAnsiedad.valores[3],
                            autoeficacia: ultimoCalculoAnsiedad.valores[4]
                        },
                        analisisIA: ultimoCalculoAnsiedad.informeIA
                    });

                    await updateDoc(ref, { medidor_ansiedad: lista });
                    alert("¡Evaluación de Ansiedad guardada exitosamente en la base de datos de Firestore!");
                } catch (err) {
                    console.error("Error al guardar en Firestore:", err);
                    alert("Hubo un error al guardar los datos en la base de datos.");
                }
            },

            pdf: function() {
                const sel = document.getElementById('RECA_PacSel');
                if (!sel.value) {
                    alert("Por favor, selecciona un paciente primero.");
                    return;
                }
                const pac = sel.options[sel.selectedIndex].text;
                const elemento = document.getElementById('RECA_Container');

                const opt = { 
                    margin: 0.4, 
                    filename: `RECA_${pac.replace(/\s+/g, '_')}.pdf`, 
                    image: { type: 'jpeg', quality: 0.98 }, 
                    html2canvas: { scale: 2, backgroundColor: '#050505' }, 
                    jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' } 
                };

                html2pdf().set(opt).from(elemento).save();
            }
        };

        initAnsiedad();
    </script>
</body>
</html>
